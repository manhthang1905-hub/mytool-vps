<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hậu cần · MYTOOL</title>
<link rel="preload" href="/vendor/fonts/chakra-petch-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/he-thong.css?v=6">
<style>
.anh-hung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;margin-bottom:16px}
.anh-hung .tren{display:flex;align-items:center;gap:8px;font:600 11px var(--f-hud);letter-spacing:.22em;text-transform:uppercase;color:var(--ta)}
.anh-hung h1{margin:6px 0 4px;font:700 clamp(21px,2.4vw,30px)/1.15 var(--f-chu);background:linear-gradient(90deg,#fff,#b7c7df);-webkit-background-clip:text;background-clip:text;color:transparent}
.bao-dong-tong{display:flex;align-items:center;gap:12px;padding:12px 16px}
.bao-dong-tong .so-lon{font:700 30px/1 var(--f-hud)}
@media (max-width:820px){.anh-hung{grid-template-columns:minmax(0,1fr)}}

/* ---- tài nguyên máy ---- */
.tai-nguyen{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1300px){.tai-nguyen{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tai-nguyen{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tn{padding:12px 14px}
.tn .nhan{display:flex;align-items:center;gap:7px;font:600 10.5px var(--f-hud);letter-spacing:.14em;text-transform:uppercase;color:var(--mo)}
.tn .gt{font:700 20px/1.2 var(--f-hud);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .phu{font-size:11.5px;color:var(--mo);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .thanh-tien{margin-top:8px}
.den{width:9px;height:9px;border-radius:50%;flex:none;margin-left:auto}
.den.tot{background:var(--tot);box-shadow:0 0 10px var(--tot)} .den.canh{background:var(--canh);box-shadow:0 0 10px var(--canh)} .den.hong{background:var(--hong);box-shadow:0 0 10px var(--hong)}

/* ---- công trình (trạm) ---- */
.cong-trinh{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;padding:14px 16px 18px;position:relative}
.cong-trinh:before{content:"";position:absolute;left:8%;right:8%;top:58px;height:4px;border-radius:4px;
  background:repeating-linear-gradient(90deg,rgba(46,230,197,.35) 0 14px,transparent 14px 22px);opacity:.55}
.ct{position:relative;padding:12px;border-radius:14px;background:linear-gradient(180deg,#132036,#0b1322);border:1px solid var(--vien);text-align:center;min-width:0}
.ct .mai{width:54px;height:54px;margin:0 auto 8px;display:grid;place-items:center;border-radius:14px;color:var(--mo);
  background:linear-gradient(160deg,#1e2c45,#0f1828);border:1px solid var(--vien2);transform:rotate(45deg)}
.ct .mai svg{transform:rotate(-45deg);width:24px;height:24px}
.ct.co .mai{color:#04121a;background:linear-gradient(160deg,var(--ta),#0e9f8b);border-color:#a7fff0;box-shadow:0 0 24px -4px var(--ta-phat)}
.ct.dang .mai{background:linear-gradient(160deg,var(--vang),#d97706);border-color:#fde68a;box-shadow:0 0 24px -4px rgba(251,191,36,.6)}
.ct b{display:block;font:700 12.5px var(--f-hud);letter-spacing:.06em;text-transform:uppercase}
.ct .phu{font-size:11px;color:var(--mo);margin-top:1px}
.ct .dem{font:700 26px/1.1 var(--f-hud);margin-top:6px}
.ct .ds{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;min-height:20px}
@media (max-width:900px){.cong-trinh{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.cong-trinh:before{display:none}}
@media (max-width:520px){.cong-trinh{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ct{padding:10px 6px}.ct .phu{display:none}.ct .mai{width:38px;height:38px;border-radius:10px}.ct .mai svg{width:18px;height:18px}.ct b{font-size:10.5px;letter-spacing:.02em}.ct .dem{font-size:20px}}

/* ---- xưởng: làn sản xuất ---- */
.luoi{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start;margin-top:16px}
@media (max-width:1240px){.luoi{grid-template-columns:minmax(0,1fr)}}
.lan-ds{padding:10px 16px 16px;display:grid;gap:10px}
.lan{display:grid;grid-template-columns:210px minmax(0,1fr) 150px;gap:16px;align-items:center;padding:12px 14px;border-radius:14px;
  background:linear-gradient(90deg,rgba(22,34,58,.85),rgba(10,16,28,.85));border:1px solid var(--vien);cursor:pointer;transition:border-color .15s}
.lan:hover{border-color:rgba(46,230,197,.4)} .lan.chon{border-color:var(--vang)}
.lan.chay{border-color:rgba(251,191,36,.45);box-shadow:0 0 26px -12px rgba(251,191,36,.7)}
.lan.hong{border-color:rgba(248,113,113,.55)}
.lan.ngoai{opacity:.78}
@media (max-width:980px){.lan{grid-template-columns:minmax(0,1fr) 130px}.lan .bang{grid-column:1/-1;grid-row:2}}
@media (max-width:520px){.lan{grid-template-columns:minmax(0,1fr)}.lan .thanh-pham{grid-row:auto}}
.ai{display:flex;align-items:center;gap:14px;min-width:0}
.anh-dai.dai{font-size:9.5px;letter-spacing:-.02em}
.anh-dai{position:relative;flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:11px;font:700 12px var(--f-hud);color:#04121a;
  background:linear-gradient(135deg,hsl(var(--h) 85% 68%),hsl(calc(var(--h) + 40) 80% 45%));box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.anh-dai .canh-bao{position:absolute;right:-7px;top:-7px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--hong);color:#fff;border:2px solid #0b1220;box-shadow:0 0 12px var(--hong)}
.anh-dai .canh-bao svg{width:11px;height:11px;stroke-width:3}
.anh-dai .canh-bao.vang{background:var(--vang);color:#2a1a00;box-shadow:0 0 10px rgba(251,191,36,.6)}
.ai b{display:block;font:700 13.5px var(--f-hud);letter-spacing:.04em}
.ai span.jp{display:block;font-size:12px;color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai .tram{margin-top:4px}
/* băng chuyền 8 khâu */
.bang{position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding-top:26px;min-width:0;--o:42px}
.bang:before{content:"";position:absolute;left:18px;right:18px;top:43px;height:4px;border-radius:4px;background:rgba(125,160,215,.12)}
.bang .chay-qua{position:absolute;left:18px;top:43px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ta2),var(--ta));box-shadow:0 0 10px var(--ta-phat)}
.bang .dang-chay{position:absolute;top:43px;height:4px;border-radius:4px;overflow:hidden}
.bang .dang-chay:before{content:"";position:absolute;top:0;bottom:0;left:-28px;right:0;background:repeating-linear-gradient(90deg,var(--vang) 0 8px,transparent 8px 14px);animation:bang 1.2s linear infinite;will-change:transform}
@keyframes bang{to{transform:translateX(28px)}}
.may{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;width:42px;flex:none}
.may i{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#0d1626;border:1px solid var(--vien2);color:var(--mo2)}
.may i svg{width:18px;height:18px}
.may small{font:600 10px/1.2 var(--f-chu);color:var(--mo2);text-align:center;white-space:nowrap}
.may.xong i{background:linear-gradient(160deg,rgba(46,230,197,.28),rgba(46,230,197,.08));border-color:rgba(46,230,197,.6);color:var(--ta)}
.may.xong small{color:var(--mo)}
.may.dang i{background:linear-gradient(160deg,#fbbf24,#d97706);border-color:#fde68a;color:#2a1a00;box-shadow:0 0 18px -2px rgba(251,191,36,.8)}
.may.dang small{color:var(--vang);font-weight:700}
.may.dang i:after{content:"";position:absolute;inset:-5px;border-radius:15px;border:2px solid rgba(251,191,36,.6);animation:nhip-may 2s ease-out infinite}
@keyframes nhip-may{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.25);opacity:0}}
.may.loi i{background:linear-gradient(160deg,#ef4444,#991b1b);border-color:#fca5a5;color:#fff;box-shadow:0 0 18px -2px rgba(239,68,68,.8)}
.may.bo_qua i{opacity:.55}
.may .tien{position:absolute;top:-8px;right:-10px;padding:0 5px;border-radius:99px;font:700 9.5px/16px var(--f-hud);background:#0b1220;border:1px solid var(--vang);color:var(--vang)}
@media (max-width:620px){.may small{display:none}.may{width:30px}.may i{width:30px;height:30px;border-radius:9px}.may i svg{width:14px;height:14px}.bang:before,.bang .chay-qua,.bang .dang-chay{top:38px}.bang{--o:30px}}
.xe{position:absolute;top:0;left:calc(100% * var(--f));transform:translateX(calc(var(--f) * -100%));z-index:2;display:flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:7px;
  font:700 10px var(--f-hud);letter-spacing:.04em;white-space:nowrap;color:#04121a;background:linear-gradient(180deg,#5ff5da,#14b8a6);box-shadow:0 4px 10px -3px rgba(0,0,0,.7);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.xe svg{width:14px;height:14px} .xe:after{content:"";position:absolute;left:calc(var(--o) / 2 + var(--f) * (100% - var(--o)));bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#14b8a6}
.xe.do{background:linear-gradient(180deg,#fca5a5,#ef4444);color:#fff} .xe.do:after{border-top-color:#ef4444}
.xe.cho{background:linear-gradient(180deg,#334155,#1e293b);color:var(--mo)} .xe.cho:after{border-top-color:#1e293b}
.xe.chay{background:linear-gradient(180deg,#fde68a,#f59e0b)} .xe.chay:after{border-top-color:#f59e0b}
.may.ket i{border-color:#fca5a5;color:#fecaca;background:rgba(239,68,68,.22)}
.may.ket i:after{content:"";position:absolute;inset:-5px;border-radius:15px;border:2px solid rgba(239,68,68,.75);animation:nhip-may 1.6s ease-out infinite}
.may.ket small{color:#fca5a5;font-weight:700}
.kho-dan{display:flex;align-items:center;gap:12px;padding:12px 16px}
.kho-dan .dan{display:flex;gap:3px;margin-top:6px} .kho-dan .dan i{width:7px;height:16px;border-radius:2px 2px 1px 1px;background:linear-gradient(180deg,#fde68a,#b45309)}
.kho-dan.can .dan i{background:rgba(125,160,215,.16)} .kho-dan.can .dan i:first-child{background:linear-gradient(180deg,#fca5a5,#b91c1c)}
.kho-dan .so-lon{font:700 18px/1.1 var(--f-hud)}
.hai-the{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.ghi-lan{margin-top:6px;font-size:11.5px;color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thanh-pham{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0}
.thung{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px dashed var(--vien2);color:var(--mo2)}
.thung.co{border-style:solid;border-color:rgba(96,165,250,.6);color:var(--xanh);background:rgba(96,165,250,.1)}
.thung.hen{border-style:solid;border-color:rgba(46,230,197,.7);color:#04121a;background:linear-gradient(160deg,var(--ta),#0e9f8b);box-shadow:0 0 18px -4px var(--ta-phat)}
.thanh-pham .tp-chu{min-width:0;text-align:right}
.thanh-pham .tp-chu b{display:block;font:700 13px var(--f-hud)}
.thanh-pham .tp-chu span{display:block;font-size:11px;color:var(--mo);white-space:nowrap}
@media (max-width:520px){.thanh-pham{justify-content:flex-start;flex-direction:row-reverse}.thanh-pham .tp-chu{text-align:left}}

/* ---- báo động + nhật ký ---- */
.bd-ds{padding:10px 16px 16px;display:grid;gap:8px}
.bd{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 10px;border-radius:11px;background:linear-gradient(90deg,rgba(248,113,113,.12),transparent);border:1px solid rgba(248,113,113,.25);font-size:12.5px}
.bd .bieu{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(248,113,113,.18);color:var(--hong)}
.bd .luc{font:600 11px var(--f-hud);color:var(--mo)}
.bd.vua{background:linear-gradient(90deg,rgba(251,191,36,.10),transparent);border-color:rgba(251,191,36,.28)} .bd.vua .bieu{background:rgba(251,191,36,.15);color:var(--vang)}
.bd.ok{background:linear-gradient(90deg,rgba(52,211,153,.1),transparent);border-color:rgba(52,211,153,.25)} .bd.ok .bieu{background:rgba(52,211,153,.16);color:var(--tot)}
.terminal{max-height:300px}
.khau-ds .k{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(125,160,215,.07);font-size:13px}
.khau-ds .k i{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:#0d1626;border:1px solid var(--vien2);color:var(--mo2)}
.khau-ds .k.xong i{color:var(--ta);border-color:rgba(46,230,197,.5)} .khau-ds .k.dang i{color:#2a1a00;background:var(--vang)} .khau-ds .k.loi i{color:#fff;background:var(--hong)}
.khau-ds .k i svg{width:14px;height:14px}
</style>
</head>
<body>
<header class="thanh-tren">
  <div class="logo"><span class="huy-hieu" id="logo-ic"></span><span class="chu-logo">MYTOOL<small>Trung tâm chỉ huy</small></span></div>
  <nav class="tabs" aria-label="Trang">
    <a class="tab" href="/"><svg class="ic" viewBox="0 0 24 24" data-ic="map"></svg><span>Chiến trường</span></a>
    <a class="tab on" href="/hau-can" aria-current="page"><svg class="ic" viewBox="0 0 24 24" data-ic="factory"></svg><span>Hậu cần</span></a>
    <a class="tab" href="/nao"><svg class="ic" viewBox="0 0 24 24" data-ic="brain"></svg><span>Não</span></a>
    <a class="tab" href="/gioi-thieu"><svg class="ic" viewBox="0 0 24 24" data-ic="play"></svg><span>Giới thiệu</span></a>

  <span class="gian"></span>
  <span class="song"><i class="cham-song" id="cham-song"></i><span class="chu-song" id="chu-song">đang tải…</span></span>
</header>

<main class="trang">
  <section class="anh-hung vao">
    <div>
      <div class="tren"><svg class="ic" viewBox="0 0 24 24" data-ic="factory"></svg>Căn cứ hậu cần</div>
      <h1>Xưởng video ngày mai</h1>
      <div class="mo nho" id="tom-tat">đang kiểm kê…</div>
    </div>
    <div class="hai-the"><div class="panel kho-dan goc vang" id="kho-dan"></div><div class="panel bao-dong-tong goc dich" id="bao-dong-tong"></div></div>
  </section>

  <section class="tai-nguyen" id="tai-nguyen" aria-label="Tài nguyên máy"></section>

  <section class="panel goc" aria-label="Dây chuyền">
    <div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="layers"></svg>Tuyến công trình</h2><span class="phu" style="margin-left:auto">mỗi kênh là một chuyến hàng: video lên sóng ngày mai</span></div>
    <div class="cong-trinh" id="cong-trinh"></div>
  </section>

  <div class="luoi">
    <section class="panel goc vang" aria-label="Xưởng sản xuất">
      <div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="hammer"></svg>Xưởng sản xuất — 8 khâu</h2><span class="phu" id="xuong-phu" style="margin-left:auto"></span></div>
      <div class="lan-ds" id="lan-ds"></div>
    </section>
    <aside style="display:grid;gap:16px">
      <section class="panel goc dich" aria-label="Báo động"><div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="alert"></svg>Báo động 24 giờ</h2></div><div class="bd-ds" id="loi"></div></section>
      <section class="panel goc" aria-label="Sự kiện agent"><div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="terminal"></svg>Nhật ký agent</h2></div>
        <div class="panel-than"><div class="terminal" id="su-kien"></div></div></section>
      <section class="panel goc" aria-label="Sản xuất"><div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="terminal"></svg>Nhật ký sản xuất</h2></div>
        <div class="panel-than"><div class="terminal" id="san-xuat"></div></div></section>
    </aside>
  </div>
</main>

<script src="/vendor/chung.js?v=6"></script>
<script>
"use strict";
const {esc, fmt, so, ic} = MT;
document.querySelectorAll("svg[data-ic]").forEach(s => { s.innerHTML = MT.icTho(s.dataset.ic); });
document.getElementById("logo-ic").innerHTML = ic("swords", "lon");
const TRAM = [
  {ma: "nghien_cuu", ten: "Nghiên cứu", phu: "chọn nguồn đối thủ", ic: "search"},
  {ma: "san_xuat", ten: "Sản xuất", phu: "8 khâu: kịch bản → dựng", ic: "hammer"},
  {ma: "ban_giao", ten: "QA · Bàn giao", phu: "kiểm video, xếp lịch", ic: "check"},
  {ma: "cho_dang", ten: "Chờ tải lên", phu: "agent sẽ đăng", ic: "upload"},
  {ma: "da_hen", ten: "Đã hẹn", phu: "chờ lên sóng", ic: "calendar"},
];
const TEN_TRAM = {nghien_cuu: "Đang nghiên cứu", san_xuat: "Đang sản xuất", ban_giao: "Đang bàn giao", cho_dang: "Chờ tải lên",
  da_hen: "Đã hẹn lịch", cho: "Chờ mở cửa sản xuất", khac: "Sản xuất ở máy khác"};
const IC_KHAU = {"kich-ban": "file", "giong-doc": "mic", "phu-de": "captions", "bang-canh": "grid", "anh": "image", "clip": "film", "thumbnail": "frame", "dung": "scissors"};
const MAC_DINH_KHAU = [["kich-ban", "Kịch bản"], ["giong-doc", "Giọng đọc"], ["phu-de", "Phụ đề"], ["bang-canh", "Bảng cảnh"], ["anh", "Ảnh cảnh"], ["clip", "Clip"], ["thumbnail", "Ảnh bìa"], ["dung", "Dựng video"]];
let DU = null, NGAN = m => m;
const hue = ma => 150 + MT.bam(ma) % 80;

function lopTram(k) { return k.tram === "da_hen" ? "ta" : k.tram === "cho_dang" ? "xanh" : k.suc_khoe === "hong" ? "dich" : (k.tram === "khac" || k.tram === "cho") ? "" : "vang"; }
function khauCua(k) {
  const ks = (k.luot && k.luot.khau) || [];
  if (ks.length) return ks;
  const xong = k.tram === "da_hen" || k.tram === "cho_dang" || k.tram === "ban_giao";
  return MAC_DINH_KHAU.map(([ma, ten]) => ({ma, ten, tt: xong ? "xong" : "cho"}));
}
const ttMay = tt => tt === "xong" ? "xong" : tt === "bo_qua" ? "xong bo_qua" : tt === "dang" ? "dang" : tt === "loi" ? "loi" : "";
function canhBao(k) {
  const kn = (k.ky_nang && k.ky_nang.can_chu_y) || [];
  return {loi: kn.filter(x => x.tt === "loi").length, thieu: kn.filter(x => x.tt === "thieu").length, ds: kn};
}

let SK = null; const XE_CU = {};
function taiNguyen() {
  const m = DU.may || {}, ram = m.ram || {}, kenh = DU.kenh || [];
  const coVideo = kenh.filter(k => k.video_mai && k.video_mai.co).length, hen = kenh.filter(k => k.video_mai && k.video_mai.da_hen).length;
  const pRam = ram.tong ? 1 - ram.trong / ram.tong : 0, pO = m.o_tong_gb ? 1 - m.o_trong_gb / m.o_tong_gb : 0;
  const o = [
    ["Agent", "pulse", m.agent_song ? "tot" : "hong", m.agent_song ? "Đang sống" : "IM LẶNG", m.nhip_giay >= 0 ? `nhịp tim ${m.nhip_giay}s trước` : "không thấy nhịp tim"],
    ["Bộ não", "brain", (DU.nao || {}).phien_hom_nay ? "tot" : "canh", (DU.nao || {}).phien_hom_nay ? "Đã chạy" : "Chờ phiên", (DU.nao || {}).phien_hom_nay ? "phiên hôm nay xong" : "phiên sáng chưa chạy"],
    ["Máy đăng", "upload", m.dang_dang ? "canh" : "tot", m.dang_dang ? "Đang đăng" : "Rảnh", m.dang_dang ? "đang tải video lên" : "sẵn sàng"],
    ["RAM", "cpu", ram.trong < 2 ? "hong" : ram.trong < 4 ? "canh" : "tot", `${so(ram.trong, 1)} GB trống`, `trên ${so(ram.tong, 0)} GB`, pRam],
