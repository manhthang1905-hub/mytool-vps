<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Não · MYTOOL</title>
<link rel="preload" href="/vendor/fonts/chakra-petch-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/he-thong.css?v=6">
<style>
:root{--ai:#a78bfa;--ai2:#7c3aed}
nav.tabs a.tab.on:after{background:var(--ai);box-shadow:0 0 12px var(--ai)} nav.tabs a.tab.on svg{color:var(--ai)}
/* ---- cố vấn ---- */
.co-van{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:26px;align-items:center;padding:20px 22px;margin-bottom:16px;
  background:radial-gradient(600px 240px at 0% 0%,rgba(167,139,250,.16),transparent 70%),var(--the)}
@media (max-width:1100px){.co-van{grid-template-columns:auto minmax(0,1fr)}.co-van .dong-ho{grid-column:1/-1;justify-self:center}}
@media (max-width:600px){.co-van{grid-template-columns:minmax(0,1fr);text-align:center}.co-van .chan-dung{margin:0 auto}.co-van .phu-hieu,.co-van .cac-chip{justify-content:center}}
.chan-dung{position:relative;width:132px;height:146px}
.chan-dung .khung{position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#c4b5fd,#6d28d9 55%,#2e1065)}
.chan-dung .trong-k{position:absolute;inset:4px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#3b2a6b,#120a26 70%)}
.chan-dung .trong-k svg{width:62px;height:62px;color:#ddd6fe;stroke-width:1.4;filter:drop-shadow(0 0 12px rgba(167,139,250,.9))}
.chan-dung .ham{white-space:nowrap;position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);display:flex;gap:2px;padding:3px 9px;border-radius:99px;background:#0b1220;border:1px solid rgba(251,191,36,.6);color:var(--vang)}
.chan-dung .ham svg{width:12px;height:12px;fill:currentColor;stroke:none}
.co-van .tren{font:600 11px var(--f-hud);letter-spacing:.22em;text-transform:uppercase;color:var(--ai)}
.co-van h1{margin:4px 0 2px;font:700 clamp(22px,2.4vw,30px)/1.15 var(--f-chu)}
.co-van .cap-bac{font:700 18px var(--f-hud);letter-spacing:.06em;color:var(--vang);text-shadow:0 0 16px rgba(251,191,36,.35)}
.co-van .phu-hieu{display:flex;align-items:center;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.co-van .len-ham{max-width:420px;font-size:12px;color:var(--mo)}
.co-van .len-ham .thanh-tien{margin:6px 0 4px}
.cac-chip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dong-ho{position:relative;width:230px;text-align:center}
.dong-ho svg{display:block;width:230px;height:140px}
.dong-ho .so-to{position:absolute;left:0;right:0;top:76px;font:700 34px/1 var(--f-hud)}
.dong-ho .nhan{font:600 10.5px var(--f-hud);letter-spacing:.18em;color:var(--mo);margin-top:2px}

/* ---- ô chỉ số ---- */
.o-ds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1200px){.o-ds{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.o-ds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.o{padding:12px 14px}
.o .nhan{display:flex;align-items:center;gap:7px;font:600 10.5px var(--f-hud);letter-spacing:.14em;text-transform:uppercase;color:var(--mo)}
.o .nhan svg{color:var(--ai)}
.o .gt{font:700 24px/1.2 var(--f-hud);margin-top:6px;font-variant-numeric:tabular-nums}
.o .phu{font-size:11.5px;color:var(--mo);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nang-luong{display:flex;gap:4px;margin-top:8px} .nang-luong i{flex:1;height:8px;border-radius:3px;background:rgba(125,160,215,.14);transform:skewX(-18deg)}
.nang-luong i.on{background:linear-gradient(90deg,var(--ai2),var(--ai));box-shadow:0 0 8px rgba(167,139,250,.6)}

/* ---- lưới ---- */
.luoi{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.luoi2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
@media (max-width:1150px){.luoi,.luoi2{grid-template-columns:minmax(0,1fr)}}
.bd-vung svg.vong{width:auto}
.loc-hang{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}

/* ---- nhật ký trận ---- */
.tran-ds{position:relative;padding:12px 16px 16px 16px}
.tran-ds:before{content:"";position:absolute;left:31px;top:16px;bottom:22px;width:2px;background:linear-gradient(180deg,rgba(167,139,250,.4),rgba(125,160,215,.08))}
.tran{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;margin-bottom:12px}
.tran .nut-t{position:relative;z-index:1;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#141c30;border:1px solid var(--vien2);color:var(--mo)}
.tran .the-t{position:relative;padding:11px 12px;border-radius:12px;background:var(--the2);border:1px solid var(--vien);overflow:hidden}
.tran.thang .nut-t{background:var(--tot);color:#03221d;border-color:#a7f3d0;box-shadow:0 0 14px -2px var(--tot)}
.tran.thua .nut-t{background:var(--hong);color:#fff;border-color:#fecaca;box-shadow:0 0 14px -2px var(--hong)}
.tran.cho .nut-t{background:linear-gradient(160deg,var(--ai),var(--ai2));color:#fff;border-color:#ddd6fe;box-shadow:0 0 14px -2px rgba(167,139,250,.8)}
.tran.toi-han .nut-t{background:var(--vang);color:#2a1a00}
.tran.thang .the-t{border-color:rgba(52,211,153,.35);background:linear-gradient(120deg,rgba(52,211,153,.08),var(--the2) 50%)}
.tran.thua .the-t{border-color:rgba(248,113,113,.35);background:linear-gradient(120deg,rgba(248,113,113,.08),var(--the2) 50%)}
.tran.mo-nhat{opacity:.66}
.dau-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-right:96px}
.dau-t .luc{font:600 11px var(--f-hud);color:var(--mo2)}
.noi{margin-top:6px;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.ly{margin-top:4px;font-size:12px;color:var(--mo)}
.du-doan{margin-top:8px;display:flex;gap:8px;padding:8px 10px;border-radius:9px;background:rgba(5,9,18,.5);border:1px dashed rgba(167,139,250,.35);font-size:12.5px}
.du-doan svg{color:var(--ai);flex:none;margin-top:2px}
.chan-t{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--mo)}
.dau-moc{position:absolute;top:12px;right:10px;padding:3px 9px;border:2px solid currentColor;border-radius:6px;font:700 12px/1 var(--f-hud);letter-spacing:.14em;
  transform:rotate(-7deg);opacity:.92;background:rgba(5,9,18,.35)}
.dau-moc.thang{color:var(--tot)} .dau-moc.thua{color:var(--hong)} .dau-moc.cho{color:var(--ai)} .dau-moc.het{color:var(--tranh)} .dau-moc.khac{color:var(--mo)}

/* ---- dòng suy nghĩ ---- */
.chon-phien{display:flex;align-items:center;gap:8px;margin-left:auto}
.phan-doan{display:inline-flex;padding:3px;border-radius:10px;background:rgba(5,9,18,.6);border:1px solid var(--vien)}
.phan-doan button{border:0;background:none;padding:4px 10px;border-radius:7px;font:600 11.5px var(--f-chu);color:var(--mo);cursor:pointer}
.phan-doan button.on{background:var(--the3);color:var(--chu);box-shadow:0 0 0 1px var(--vien2)}
.hoi-dong{max-height:820px;overflow:auto;padding:4px 2px 4px 0;display:flex;flex-direction:column;gap:10px}
.hd-tin{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start}
.hd-mat{width:38px;height:42px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#c4b5fd,#6d28d9);color:#f5f3ff}
.hd-mat svg{width:20px;height:20px}
.hd-bong{position:relative;padding:10px 13px;border-radius:4px 14px 14px 14px;background:linear-gradient(160deg,rgba(124,58,237,.16),rgba(22,33,54,.85));border:1px solid rgba(167,139,250,.28);font-size:13px;line-height:1.55}
.hd-bong .ai-ten{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;font:700 11.5px var(--f-hud);letter-spacing:.08em;color:#ddd6fe}
.hd-bong .ai-ten span{font-weight:500;color:var(--mo2)}
.hd-bong p{margin:0 0 3px} .hd-bong .tde{font-weight:700;margin-top:5px} .hd-bong .gach{padding-left:14px;text-indent:-10px} .hd-bong b{color:#e9d5ff}
.hd-bong.cuoi{border-color:rgba(46,230,197,.45);background:linear-gradient(160deg,rgba(46,230,197,.12),rgba(22,33,54,.85))}
.hd-bong.tom{border-color:rgba(96,165,250,.4)}
.hd-he{align-self:center;max-width:92%;font:12px/1.5 var(--f-ma);color:var(--mo);text-align:center}
.hd-he details summary{cursor:pointer;list-style:none;padding:3px 10px;border-radius:99px;border:1px dashed var(--vien2);display:inline-block}
.hd-he details summary::-webkit-details-marker{display:none}
.hd-he .cong-cu{margin-top:6px;text-align:left;padding:8px 10px;border-radius:8px;background:#03060c;color:#8ea0bd;white-space:pre-wrap;word-break:break-word}
.hd-vach{display:flex;align-items:center;gap:10px;color:var(--ai);font:600 11px var(--f-hud);letter-spacing:.14em}
.hd-vach:before,.hd-vach:after{content:"";flex:1;height:1px;background:rgba(167,139,250,.3)}
.hd-ket{align-self:center;padding:8px 16px;border:2px solid currentColor;border-radius:8px;transform:rotate(-2deg);font:700 13px var(--f-hud);letter-spacing:.12em}
.thang-ham{display:flex;gap:3px;margin:8px 0 2px;max-width:420px}
.thang-ham i{flex:1;height:6px;border-radius:2px;background:rgba(125,160,215,.14)}
.thang-ham i.qua{background:var(--vang)} .thang-ham i.nay{background:#fde68a;box-shadow:0 0 8px var(--vang)}
.thang-ham-chu{display:flex;justify-content:space-between;max-width:420px;font:600 9.5px var(--f-hud);letter-spacing:.06em;color:var(--mo2)}
select{background:var(--the3);color:var(--chu);border:1px solid var(--vien2);border-radius:8px;padding:4px 8px;font:500 12.5px var(--f-chu)}
.terminal.nghi-ds{max-height:820px;padding:12px 14px;font-family:var(--f-chu);font-size:13px;line-height:1.55}
.tk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:6px 0}
.tk .gio{font:11.5px/1.75 var(--f-ma);color:var(--mo2)}
.tk .chu p{margin:0 0 3px;color:#d3dcec} .tk .chu .tde{font-weight:700;color:#fff;margin-top:4px} .tk .chu .gach{padding-left:14px;text-indent:-10px}
.tk .chu b{color:#e9d5ff}
.tk.nghi .chu{border-left:2px solid rgba(167,139,250,.55);padding-left:10px}
.tk.nghi.cuoi .chu{border-left-color:var(--ta)}
.tk.cu .chu{font:12px/1.6 var(--f-ma);color:var(--mo)}
.tk.ket .chu{font:600 12.5px var(--f-ma)}
.tk.tom .chu{border-left:2px solid var(--xanh);padding-left:10px}
.tk details summary{cursor:pointer;list-style:none;color:#93a4c0} .tk details summary::-webkit-details-marker{display:none}
.tk details summary:before{content:"▸ ";color:var(--ai)} .tk details[open] summary:before{content:"▾ "}
.tk .cong-cu{margin-top:4px;padding:6px 8px;border-radius:7px;background:#03060c;color:#8ea0bd;white-space:pre-wrap;word-break:break-word}
.vach{display:flex;align-items:center;gap:10px;color:var(--ai);font:600 11.5px var(--f-ma);margin:6px 0}
.vach:after{content:"";flex:1;height:1px;background:rgba(167,139,250,.3)}
.con-tro{display:inline-block;width:8px;height:14px;background:var(--ai);vertical-align:-2px;margin-left:4px;animation:nhay-ct 1.1s steps(2) infinite}
@keyframes nhay-ct{50%{opacity:0}}

/* ---- trí nhớ / bài học ---- */
.so-tay{padding:10px 16px 16px;display:grid;gap:9px}
.tep{padding:10px 12px;border-radius:11px;background:var(--the2);border:1px solid var(--vien)}
.tep .d1{display:flex;align-items:center;gap:8px}
.tep .d1 b{font-size:13px;overflow-wrap:anywhere} .tep .d1 .meta{margin-left:auto;font:600 11px var(--f-hud);color:var(--mo2);white-space:nowrap}
.tep .dong{font-size:12px;color:var(--mo);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bh-ds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:12px 16px 16px}
.bh{position:relative;padding:12px;border-radius:12px;background:var(--the2);border:1px solid var(--vien);display:flex;flex-direction:column;gap:7px}
.bh.that{border-color:rgba(251,191,36,.38);background:linear-gradient(160deg,rgba(251,191,36,.07),var(--the2) 55%)}
.bh .d1{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bh .nd{font-size:12.5px;line-height:1.5}
.phieu{display:flex;align-items:center;gap:8px;font:700 11px var(--f-hud)}
.phieu .thanh{flex:1;display:flex;height:6px;border-radius:4px;overflow:hidden;background:rgba(125,160,215,.12)}
.phieu .thanh b{background:var(--tot)} .phieu .thanh i{background:var(--hong)}
.bh .chan{font-size:11px;color:var(--mo2);margin-top:auto}
</style>
</head>
<body>
<header class="thanh-tren">
  <div class="logo"><span class="huy-hieu" id="logo-ic"></span><span class="chu-logo">MYTOOL<small>Trung tâm chỉ huy</small></span></div>
  <nav class="tabs" aria-label="Trang">
    <a class="tab" href="/"><svg class="ic" viewBox="0 0 24 24" data-ic="map"></svg><span>Chiến trường</span></a>
    <a class="tab" href="/hau-can"><svg class="ic" viewBox="0 0 24 24" data-ic="factory"></svg><span>Hậu cần</span></a>
    <a class="tab on" href="/nao" aria-current="page"><svg class="ic" viewBox="0 0 24 24" data-ic="brain"></svg><span>Não</span></a>
    <a class="tab" href="/gioi-thieu"><svg class="ic" viewBox="0 0 24 24" data-ic="play"></svg><span>Giới thiệu</span></a>
  </nav>
  <span class="gian"></span>
  <span class="song"><i class="cham-song" id="cham-song"></i><span class="chu-song" id="chu-song">đang tải…</span></span>
</header>

<main class="trang">
  <section class="panel co-van goc tim vao" id="co-van" aria-label="Cố vấn chiến lược"></section>
  <section class="o-ds" id="o-ds" aria-label="Chỉ số"></section>

  <div class="luoi">
    <section class="panel goc tim" aria-label="Nhật ký chiến dịch">
      <div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="swords" style="color:var(--ai)"></svg>Nhật ký quyết định — dự đoán và chấm</h2></div>
      <div class="loc-hang" id="loc"></div>
      <div class="tran-ds" id="hanh-dong"></div>
    </section>
    <section class="panel goc tim" aria-label="Dòng suy nghĩ">
      <div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="message" style="color:var(--ai)"></svg>Hội đồng chiến lược</h2>
        <span class="phan-doan" id="che-do"><button class="on" data-cd="hoi">Hội đồng</button><button data-cd="tm">Terminal</button></span>
        <span class="chon-phien"><label class="mo nho" for="chon-phien">phiên</label><select id="chon-phien"></select></span></div>
      <div class="panel-than">
        <div class="mo nho" id="phien-tom" style="margin-bottom:8px"></div>
        <div class="hoi-dong" id="hoi-dong"></div>
        <div class="terminal nghi-ds an" id="khung-tm"><div class="terminal-dau"><i></i><i></i><i></i><span class="mo rat-nho" style="margin-left:8px;font-family:var(--f-ma)" id="phien-ten">nao/nhat-ky</span></div><div id="suy-nghi"><div class="trong">đang tải…</div></div></div>
      </div>
    </section>
  </div>

  <div class="luoi2">
    <section class="panel goc tim" aria-label="Tỉ lệ đúng">
      <div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="trend" style="color:var(--ai)"></svg>Phong độ — tỉ lệ đúng cộng dồn</h2></div>
      <div class="bd-vung" id="bd-dung" style="padding:10px 16px 16px"></div>
    </section>
    <section class="panel goc tim" aria-label="Trí nhớ">
      <div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="book" style="color:var(--ai)"></svg>Sổ tay ký ức</h2><span class="phu" id="tn-phu" style="margin-left:auto"></span></div>
      <div class="so-tay" id="tri-nho"></div>
    </section>
  </div>

  <section class="panel goc vang" style="margin-top:16px" aria-label="Bài học">
    <div class="panel-dau"><h2><svg class="ic" viewBox="0 0 24 24" data-ic="scroll" style="color:var(--vang)"></svg>Kho bài học đang áp</h2><span class="phu" id="bh-tom" style="margin-left:auto"></span></div>
    <div class="loc-hang" id="bh-loc"></div>
    <div class="bh-ds" id="bai-hoc"></div>
  </section>
</main>

<script src="/vendor/chung.js?v=6"></script>
<script>
"use strict";
const {esc, so, ic} = MT;
document.querySelectorAll("svg[data-ic]").forEach(s => { s.innerHTML = MT.icTho(s.dataset.ic); });
document.getElementById("logo-ic").innerHTML = ic("swords", "lon");
let DU = null, LOC = "tat_ca", PHIEN = 0, BH_LOC = "tat_ca";
const ngay = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "—";
const loiMuc = (x, ten) => x && !Array.isArray(x) && x.loi ? `<div class="trong">không đọc được ${ten}: ${esc(x.loi)}</div>` : "";
const TEN_LENH = {"thu": ["Thử", "flag"], "tranh": ["Tránh", "shield"], "bai-hoc": ["Bài học", "book"], "uu-tien-nguon": ["Ưu tiên nguồn", "target"], "de-xuat": ["Đề xuất", "sparkles"]};
// quân hàm theo tỉ lệ đúng (chỉ phong khi đã đủ số lần chấm tối thiểu)
const HAM = [[0, "Tân binh", 0, ""], [40, "Hạ sĩ", 1, "s"], [50, "Trung sĩ", 2, "s"], [55, "Thiếu úy", 1, "u"], [60, "Trung úy", 2, "u"], [65, "Đại úy", 3, "u"],
  [70, "Thiếu tá", 1, "t"], [75, "Trung tá", 2, "t"], [80, "Đại tá", 3, "t"], [85, "Thiếu tướng", 1, "g"], [90, "Trung tướng", 2, "g"], [95, "Đại tướng", 4, "g"]];
function quanHam(d) {
  if (d.ti_le == null || (d.da_cham || 0) < (d.nguong_cham || 0)) return {ten: "Tân binh", sao: 0, i: 0, ke: HAM[1]};
  let i = 0; HAM.forEach((h, j) => { if (d.ti_le >= h[0]) i = j; });
  return {ten: HAM[i][1], sao: HAM[i][2], i, ke: HAM[i + 1]};
}

function coVan() {
  const d = DU.diem || {}, l = DU.lan_cuoi || {};
  if (d.loi) { document.getElementById("co-van").innerHTML = loiMuc(d, "điểm"); return; }
  const h = quanHam(d), chuaDu = (d.da_cham || 0) < (d.nguong_cham || 0), tl = d.ti_le;
  // đồng hồ tỉ lệ đúng: nửa vòng 180°, vạch 50% = ngưỡng co quyền
  const R = 90, cx = 115, cy = 118, goc = p => Math.PI * (1 - p), P = p => [cx + R * Math.cos(goc(p)), cy - R * Math.sin(goc(p))];
  const cung = (a, b) => { const [x1, y1] = P(a), [x2, y2] = P(b); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const p = tl == null ? 0 : MT.kep(tl / 100, 0, 1), mau = tl == null ? "var(--mo2)" : tl >= 50 ? "var(--tot)" : "var(--hong)";
  const [n1, m1] = P(.5);
  const dongHo = `<svg viewBox="0 0 230 140" aria-hidden="true">
    <defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#f87171"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
    <path d="${cung(0, 1)}" fill="none" stroke="rgba(125,160,215,.12)" stroke-width="14" stroke-linecap="round"/>

      `<div class="nang-luong">${Array.from({length: hm}, (_, i) => `<i class="${i < (d.han_muc - d.hom_nay) ? "on" : ""}" title="${i < d.han_muc ? "" : "bị co"}"></i>`).join("")}</div>`],

    ["Bài học", "book", d.bai_hoc_so == null ? "—" : so(d.bai_hoc_so), `thật ${dem.that || 0} · giả thuyết ${dem.gia_thuyet || 0} · não ghi ${d.bai_hoc_nao || 0}`],
    ["Phiên gần nhất", "clock", l.co ? ngay(l.ngay) : "—", l.co ? [`mã ${l.ma == null ? "?" : l.ma}`, l.luot ? `${l.luot} lượt` : "", l.giay ? `${so(l.giay)} giây` : "", l.usd ? `~${so(l.usd, 2)} USD` : "", l.het_gio ? "HẾT GIỜ" : ""].filter(Boolean).join(" · ") : "chưa có log phiên"],
  ];
  document.getElementById("o-ds").innerHTML = o.map(([n, i, g, p, x], j) => `<div class="panel o vao" style="animation-delay:${j * 40}ms"><div class="nhan">${ic(i)}${n}</div><div class="gt">${g}</div><div class="phu">${esc(p)}</div>${x || ""}</div>`).join("");

function dongChu(ds) {
  const dam = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return ds.map(x => {
    if (/^-{3,}\s*$/.test(x) || /^#{1,4}\s*$/.test(x)) return "";
    if (/^#{1,4}\s/.test(x)) return `<p class="tde">${dam(x.replace(/^#+\s*/, ""))}</p>`;
    if (/^[-•*]\s/.test(x)) return `<p class="gach">• ${dam(x.replace(/^[-•*]\s+/, ""))}</p>`;
    if (/^\d{1,2}\.\s/.test(x)) return `<p class="gach">${dam(x)}</p>`;
    return `<p>${dam(x)}</p>`;
  }).join("");
}
function suyNghi() {

    if (b.loai === "tom_tat") return `<div class="tk tom"><div class="gio">${esc(b.luc)}</div><div class="chu"><div class="mo nho">tóm tắt cuối phiên</div>${dongChu(b.dong || [])}</div></div>`;
    if (b.loai === "cong_cu") return `<div class="tk cu"><div class="gio">${esc(b.luc)}</div><div class="chu"><details><summary>⚙ ${b.so} lệnh: ${esc(b.tom || "")}${b.loi ? ` · <span style="color:var(--hong)">${b.loi} lỗi</span>` : ""}</summary><div class="cong-cu">${(b.dong || []).map(esc).join("\n")}</div></details></div></div>`;
    if (b.loai === "ket") return `<div class="tk ket"><div class="gio">${esc(b.luc)}</div><div class="chu" style="color:${b.thanh_cong ? "var(--tot)" : "var(--hong)"}">${b.thanh_cong ? "✔" : "✘"} ${esc(b.chu)}</div></div>`;
    return `<div class="tk cu"><div class="gio">${esc(b.luc)}</div><div class="chu">${esc(b.chu)}</div></div>`;

  const tat = DU.hanh_dong, dem = {tat_ca: tat.length, mo: tat.filter(d => d.trang_thai === "mo").length,
    dung: tat.filter(d => d.cham === "dung").length, sai: tat.filter(d => d.cham === "sai").length};
  const TEN_LOC = {tat_ca: "Tất cả", mo: "Đang chờ", dung: "Thắng", sai: "Thua"};
  document.getElementById("loc").innerHTML = Object.keys(TEN_LOC).map(k => `<button class="nut ${LOC === k ? "on" : ""}" data-loc="${k}">${TEN_LOC[k]} <b>${dem[k]}</b></button>`).join("");
  document.querySelectorAll("#loc .nut").forEach(e => e.addEventListener("click", () => { LOC = e.dataset.loc; hanhDong(); }));
  const homNay = DU.hom_nay || (DU.luc || "").slice(0, 10);
  const ds = tat.filter(d => LOC === "tat_ca" || (LOC === "mo" ? d.trang_thai === "mo" : d.cham === LOC)).slice(0, 50);
  box.innerHTML = ds.map(d => {
    const [ten, icn] = TEN_LENH[d.lenh] || [d.lenh, "flag"];
    let lop = "", moc = ["", ""];
    if (d.cham === "dung") { lop = "thang"; moc = ["thang", "THẮNG"]; }
    else if (d.cham === "sai") { lop = "thua"; moc = ["thua", "THUA"]; }
    else if (d.trang_thai === "huy") { lop = "mo-nhat"; moc = ["khac", "HUỶ"]; }
    else if (d.trang_thai === "het_han") { lop = "mo-nhat"; moc = ["het", "HẾT HẠN"]; }
    else if (d.khong_tinh) { lop = ""; moc = ["khac", d.trang_thai === "xong" ? "ĐÃ LÀM" : "KHÔNG TÍNH"]; }
    else if (d.toi_han) { lop = "toi-han"; moc = ["het", "TỚI HẠN"]; }
    else if (d.trang_thai === "mo") { lop = "cho"; moc = ["cho", "ĐANG CHỜ"]; }
    else { moc = ["khac", (d.trang_thai || "").toUpperCase()]; }
    const con = d.kiem_ngay && d.trang_thai === "mo" && !d.cham ? Math.round((new Date(d.kiem_ngay) - new Date(homNay)) / 864e5) : null;
    const noi = /^https?:\/\//.test(d.noi_dung) ? `<a href="${esc(d.noi_dung)}" target="_blank" rel="noopener">${esc(d.noi_dung.replace(/^https?:\/\/(www\.)?/, "").slice(0, 60))}</a>` : esc(d.noi_dung);
    return `<div class="tran ${lop}"><span class="nut-t">${ic(d.cham === "dung" ? "check" : d.cham === "sai" ? "x" : icn)}</span>
      <div class="the-t">${moc[1] ? `<span class="dau-moc ${moc[0]}">${moc[1]}</span>` : ""}
        <div class="dau-t"><span class="chip tim">${ic(icn)}${esc(ten)}</span>${d.kenh ? `<span class="chip">${esc(d.kenh)}</span>` : ""}<span class="luc">${esc((d.luc || "").slice(0, 16).replace("T", " "))} · ${esc(d.id)}</span></div>
        <div class="noi">${noi}</div>
        ${d.ly_do ? `<div class="ly">${esc(d.ly_do)}</div>` : ""}
        ${d.du_doan ? `<div class="du-doan">${ic("target")}<div><span class="mo">Dự đoán:</span> ${esc(d.du_doan)}</div></div>` : ""}
        <div class="chan-t">${d.kiem_ngay ? `<span class="chip ${d.toi_han ? "vang" : ""}">${ic("calendar")}kiểm ${esc(ngay(d.kiem_ngay))}${con != null ? (con > 0 ? ` · còn ${con} ngày` : con === 0 ? " · hôm nay" : " · quá hạn") : ""}</span>` : ""}
          ${d.ghi_chu_cham ? `<span>${esc(d.ghi_chu_cham)}</span>` : ""}${d.ghi_chu_dieu_phoi ? `<span>điều phối: ${esc(d.ghi_chu_dieu_phoi)}</span>` : ""}</div>
      </div></div>`;
  }).join("") || '<div class="trong" style="padding-left:44px">Không có quyết định nào ở mục này.</div>';
}

document.querySelectorAll("#che-do button").forEach(b => b.addEventListener("click", () => {
