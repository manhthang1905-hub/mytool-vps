<style>
:root{--ai:#a78bfa}
nav.tabs a.tab.on:after{background:var(--ai);box-shadow:0 0 12px var(--ai)} nav.tabs a.tab.on svg{color:var(--ai)}
html,body{height:100%;overflow:hidden}

.dem-hang{top:12px;left:296px;right:396px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:9px 4px}

.ct-dau{display:flex;gap:10px;align-items:flex-start} .ct-dau i{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px}

.ct-chip{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 4px} .ct-chip button{cursor:pointer}
.ct-so{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:12px;margin:8px 0;padding:8px 10px;border-radius:10px;background:rgba(5,9,18,.5);border:1px solid var(--vien);color:var(--mo)}
.ct-so b{color:var(--chu);font-weight:600;overflow-wrap:anywhere}
.ct-tep{font-family:var(--f-ma);margin:6px 0 2px;overflow-wrap:anywhere}
.phai .md{font-size:12.5px;line-height:1.55;color:#d3dcec;overflow-wrap:anywhere}
.phai .md h3,.phai .md h4,.phai .md h5{font:700 11.5px var(--f-hud);letter-spacing:.12em;text-transform:uppercase;color:var(--ai);margin:14px 0 4px}
.phai .md p{margin:0 0 6px} .phai .md ul{margin:0 0 6px;padding-left:18px} .phai .md li{margin:2px 0}
.phai .md code{font:11.5px var(--f-ma);color:#c4b5fd}
.phai a.lk{color:var(--ta);text-decoration:none;border-bottom:1px dashed rgba(46,230,197,.45)} .phai a.lk:hover{color:#fff}

.goi-y p,.goi-y li{font-size:12.5px;color:#c3cee0;line-height:1.55} .goi-y ul{padding-left:18px;margin:6px 0}
.san .float-tooltip-kap{max-width:330px;padding:7px 10px;border-radius:9px;background:rgba(6,10,18,.95);border:1px solid var(--vien2);color:var(--chu);font:12px/1.45 var(--f-chu);box-shadow:var(--bong)}

@media (max-width:1180px){.dem-hang{display:none}.phai{width:320px}}
@media (max-width:820px){.trai,.phai{display:none}}

<!-- force-graph 1.52.0 — giấy phép MIT — https://github.com/vasturiano/force-graph (bản vendored trong ui_web/vendor, không CDN) -->
<script src="/vendor/force-graph.min.js?v=1.52.0"></script>
<script src="/vendor/chung.js?v=7"></script>
<script>
"use strict";
const {esc, so, ic} = MT;
document.querySelectorAll("svg[data-ic]").forEach(s => { s.innerHTML = MT.icTho(s.dataset.ic); });
document.getElementById("logo-ic").innerHTML = ic("swords", "lon");
const $ = s => document.getElementById(s);
const TRUNG_TAM = "nao-trung-tam", R_VONG = 520, MAU_DONG = "#fbbf24";
const MAU = {"trung-tam": "#c4b5fd", "bo-phan": "#2ee6c5", "dang-xay-ra": "#f87171", "tai-phat": "#ff3b5c", "tam-lang": "#f5a524",
  "da-het": "#64748b", "canh-bao": "#bfa53a", "dang-dung": "#34d399", "ung-vien": "#22d3ee", "thu-thach": "#a78bfa", "thuc-the": "#cbd5e1"};
const TEN_MAU = {"dang-xay-ra": "Lỗi đang xảy ra", "tai-phat": "Lỗi tái phát", "tam-lang": "Lỗi tạm lặng", "da-het": "Đã hết",
  "canh-bao": "Cảnh báo", "dang-dung": "Bài học đang dùng", "ung-vien": "Bài học ứng viên", "thu-thach": "Bài học thử thách", "thuc-the": "Thực thể"};
const TEN_NHOM = {"loi": "Lỗi", "canh-bao": "Cảnh báo", "bai-hoc": "Bài học", "thuc-the": "Thực thể"};
const TEN_DAY = {goc: ["Trung tâm → bộ phận", "rgba(167,139,250,.30)"], thuoc: ["Bộ phận → nơ-ron", "rgba(46,230,197,.15)"],
  the: ["Nơ-ron → thực thể", "rgba(203,213,225,.09)"], noi: ["Bài nối bài", "rgba(167,139,250,.65)"], dong: ["Đồng kích hoạt — cùng cháy thì nối", "rgba(251,191,36,.55)"]};
const TEN_LOAI = {chon: "chọn", loi: "lỗi", sua: "sửa", ket_qua: "kết quả", do: "đo", dung: "dùng bài", ngu: "giấc ngủ"};
const KHOA_SO = [["so_lan", "tổng lần"], ["so_lan_7_ngay", "7 ngày"], ["su_co_48h", "sự cố 48h"], ["ti_le_tang", "nhịp ×"], ["lan_cuoi", "lần cuối"],
  ["alpha", "α"], ["beta", "β"], ["n", "bằng chứng"], ["truc", "trục"], ["nguon", "nguồn"], ["cap_nhat", "cập nhật"]];
const GOI_Y = `<div class="goi-y"><h3>Đồ thị thần kinh</h3><p>Não trung tâm ở giữa, 15 bộ phận là các hub phát sáng trên vòng (theo thứ tự dây chuyền), nơ-ron lỗi và bài học quay quanh bộ phận của mình.</p>
  <ul><li><b>Bấm bộ phận</b>: phóng vào cụm + mở sổ tay.</li><li><b>Bấm nơ-ron</b>: đọc nốt; chữ <span style="color:var(--ta)">[[liên kết]]</span> bấm được.</li>
  <li><b>Dây vàng cong</b>: đồng kích hoạt — hai nơ-ron cùng cháy trong một sự cố (cùng gói, hoặc kênh × ngày) ≥ 2 lần trong 14 ngày.</li>
  <li><b>Hạt sáng</b>: xung thần kinh thật từ sổ sự kiện, nghe 3 giây một lần — xanh lá thắng, đỏ lỗi/trượt, xanh lơ bài học vào lời nhắc, tím giấc ngủ.</li></ul></div>`;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const boDau = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
const ma = x => x && typeof x === "object" ? x.id : x;
const el = $("do-thi");
let G = null, NUT = {}, DAY = {}, KE = {}, DONG_KE = {}, HIEN = new Set(), SEL = null, KE_SEL = new Set(), KY = "", DU = null, DEM = null;
let HET = 0, NGHI = true, BAN = 0, CT = null, LUOT = 0, DA_KHOP = false;
const NHIP = [];
const LOC = {bp: "", nhom: new Set(Object.keys(TEN_NHOM)), mau: new Set(Object.keys(TEN_MAU))};

// vẽ lại trong `ms` tới (đồ thị đứng yên thì force-graph tự ngừng vẽ — đỡ CPU máy không GPU)
function ve(ms) { if (!G) return; HET = Math.max(HET, performance.now() + (ms || 80)); if (NGHI) { G.autoPauseRedraw(false); NGHI = false; } }

function mauXung(x) {
  if (x.loai === "dung") return x.ket === "doi-chung" ? "#64748b" : "#22d3ee";
  if (x.loai === "ngu") return x.ket === "truot" ? "#f87171" : "#a78bfa";
  if (x.loai === "loi" || x.ket === "truot") return "#f87171";
  return x.ket === "thang" ? "#34d399" : x.ket === "trung_binh" ? "#fbbf24" : x.loai === "sua" ? "#60a5fa" : x.loai === "chon" ? "#2ee6c5" : "#9fb4d8";
}

function moTa(n) {
  if (n.nhom === "trung-tam") return "Bấm: bản đồ 15 bộ phận";
  if (n.nhom === "bo-phan") return `${so(n.su_kien_7)} sự kiện/7 ngày · ${n.so_loi} lỗi đang cháy · ${n.so_bai} bài học`;
  if (n.nhom === "thuc-the") return `${n.so_noi} nơ-ron nối vào`;
  return [TEN_MAU[n.mau] || n.trang_thai, (NUT[n.bo_phan] || {}).ten, (n.kenh || []).join(", ")].filter(Boolean).join(" · ");
}

function veNen(ctx, k) {          // vòng quỹ đạo của các hub + quầng tím quanh não trung tâm
  ctx.save();
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R_VONG * .85);
  g.addColorStop(0, "rgba(124,58,237,.13)"); g.addColorStop(1, "rgba(124,58,237,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R_VONG * .85, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(167,139,250,.13)"; ctx.lineWidth = 1 / k; ctx.setLineDash([6 / k, 9 / k]);
  ctx.beginPath(); ctx.arc(0, 0, R_VONG, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

function veNut(n, ctx, k) {
  const r = n.kich_thuoc, mau = MAU[n.mau] || "#94a3b8", hub = n.nhom === "bo-phan" || n.nhom === "trung-tam";
  const mo = SEL && !KE_SEL.has(n.id) ? .14 : 1;
  ctx.globalAlpha = mo;
  if (hub) {
    const g = ctx.createRadialGradient(n.x, n.y, r * .3, n.x, n.y, r * 2.8);
    g.addColorStop(0, rgba(mau, .5)); g.addColorStop(1, rgba(mau, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, r * 2.8, 0, 6.2832); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832);
  ctx.fillStyle = hub ? rgba(mau, .22) : mau; ctx.fill();
  if (hub) { ctx.lineWidth = Math.max(1.5, 2.4 / k); ctx.strokeStyle = mau; ctx.stroke(); }
  if (n.id === SEL) { ctx.lineWidth = 2 / k; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(n.x, n.y, r + 3 / k, 0, 6.2832); ctx.stroke(); }
  const t = n.__sang ? (performance.now() - n.__sang) / 1600 : 1;
  if (t < 1) {                   // nơ-ron vừa cháy: quầng + vòng lan
    ctx.globalAlpha = mo * (1 - t);
    ctx.fillStyle = rgba(n.__mauSang, .35); ctx.beginPath(); ctx.arc(n.x, n.y, r * (1.3 + t * 1.5), 0, 6.2832); ctx.fill();
    ctx.lineWidth = 2 / k; ctx.strokeStyle = n.__mauSang; ctx.beginPath(); ctx.arc(n.x, n.y, r + 2 / k + t * r * 3, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = mo;
  }
  if (hub || n.id === SEL || (mo === 1 && ((n.nhom !== "thuc-the" && k > 1.8) || k > 3.5))) {
    const c = hub ? 13 : 10.5, chu = hub || n.ten.length <= 34 ? n.ten : n.ten.slice(0, 33) + "…", y = n.y + r + 3 / k;
    ctx.font = `${hub ? 700 : 500} ${c / k}px "Chakra Petch","Be Vietnam Pro",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
    ctx.lineWidth = 3 / k; ctx.strokeStyle = "rgba(4,8,15,.92)"; ctx.strokeText(chu, n.x, y);
    ctx.fillStyle = hub ? "#eef3fb" : "#c3cee0"; ctx.fillText(chu, n.x, y);
    if (n.nhom === "bo-phan" && n.so_loi) {      // huy hiệu đỏ: số lỗi đang cháy của bộ phận
      const bx = n.x + r * .78, by = n.y - r * .78, br = 7 / k;
      ctx.fillStyle = "#f87171"; ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.2832); ctx.fill();
      ctx.font = `700 ${9 / k}px "Chakra Petch",sans-serif`; ctx.fillStyle = "#1a0505"; ctx.textBaseline = "middle"; ctx.fillText(String(n.so_loi), bx, by + .5 / k);
    }
  }
  ctx.globalAlpha = 1;
}

function veHat(x, y, l, ctx, k) {  // hạt xung: lõi sáng + quầng
  const m = l.__mau || "#2ee6c5";
  ctx.fillStyle = rgba(m, .28); ctx.beginPath(); ctx.arc(x, y, 9 / k, 0, 6.2832); ctx.fill();
  ctx.fillStyle = m; ctx.beginPath(); ctx.arc(x, y, 3.4 / k, 0, 6.2832); ctx.fill();
}

function mauDay(l) {
  if (!SEL) return l.loai === "dong" ? `rgba(251,191,36,${Math.min(.75, .14 + .05 * l.trong_so)})` : (TEN_DAY[l.loai] || TEN_DAY.the)[1];
  if (ma(l.source) !== SEL && ma(l.target) !== SEL) return "rgba(125,160,215,.03)";
  return l.loai === "dong" ? "rgba(251,191,36,.9)" : "rgba(233,213,255,.7)";
}

function taoG() {
  G = ForceGraph()(el)
    .width(el.clientWidth).height(el.clientHeight).backgroundColor("rgba(0,0,0,0)")
    .nodeId("id").nodeVal(n => n.kich_thuoc).nodeRelSize(1)
    .nodeLabel(n => `<b>${esc(n.nhom === "bo-phan" || n.nhom === "trung-tam" ? n.ten : n.cau || n.ten)}</b><div class="mo">${esc(moTa(n))}</div>`)
    .nodeCanvasObject(veNut)
    .nodePointerAreaPaint((n, mau, ctx) => { ctx.fillStyle = mau; ctx.beginPath(); ctx.arc(n.x, n.y, n.kich_thuoc + 2, 0, 6.2832); ctx.fill(); })
    .linkColor(mauDay)
    .linkWidth(l => l.loai === "dong" ? Math.min(4, .6 + l.trong_so / 4) : l.loai === "goc" ? 1.6 : l.loai === "noi" ? 1.2 : .5)
    .linkCurvature(l => l.loai === "dong" ? .22 : l.loai === "noi" ? .3 : 0)
    .linkDirectionalParticleSpeed(l => (l.__nguoc ? -1 : 1) * (l.loai === "goc" ? .022 : .03))
    .linkDirectionalParticleCanvasObject(veHat)
    .d3AlphaDecay(.03).d3VelocityDecay(.38).warmupTicks(50).cooldownTicks(260).cooldownTime(9000)
    .onEngineStop(() => { if (!DA_KHOP) { DA_KHOP = true; khop(n => HIEN.has(n.id), 700); } })
    .onNodeClick(n => n.nhom === "bo-phan" || n.nhom === "trung-tam" ? tapTrung(n) : chon(n))
    .onBackgroundClick(() => chon(null))
    .onRenderFramePre(veNen)
    .onRenderFramePost(() => { if (!NGHI && performance.now() > HET) { G.autoPauseRedraw(true); NGHI = true; } });
  G.d3Force("center", null);
  G.d3Force("charge").strength(n => n.nhom === "thuc-the" ? -14 : n.nhom === "bo-phan" || n.nhom === "trung-tam" ? -120 : -(16 + n.kich_thuoc * 3)).distanceMax(240);
  G.d3Force("link")
    .distance(l => l.loai === "thuoc" ? 24 + (l.target.kich_thuoc || 4) * 2.6 : {goc: R_VONG, the: 80, noi: 40, dong: 120}[l.loai] || 60)
    .strength(l => l.loai === "dong" ? Math.min(.09, .015 * l.trong_so) : {goc: 0, thuoc: .55, the: .035, noi: .15}[l.loai] || .05);
  addEventListener("resize", MT.doiCo(() => G.width(el.clientWidth).height(el.clientHeight), 150));
}

// phóng khít các nút lọc được vào vùng TRỐNG giữa các bảng HUD (không bị bảng che)
function khop(loc, ms) {
  const b = G.getGraphBbox(loc); if (!b) return;
  const W = el.clientWidth, H = el.clientHeight, hep = W < 820, vua = W < 1180;
  const l = hep ? 16 : 296, r = W - (hep ? 16 : vua ? 344 : 396), t = vua ? 16 : 84, d = H - 162;
  const k = Math.min(3.5, .92 * Math.min((r - l) / Math.max(40, b.x[1] - b.x[0]), (d - t) / Math.max(40, b.y[1] - b.y[0])));
  G.zoom(k, ms);
  G.centerAt((b.x[0] + b.x[1]) / 2 - ((l + r) / 2 - W / 2) / k, (b.y[0] + b.y[1]) / 2 - ((t + d) / 2 - H / 2) / k, ms);
}

function capNhat(d) {
  DU = d;
  const ky = d.nut.map(n => n.id).sort().join("|") + "#" + d.day.map(l => l.source + ">" + l.target).sort().join("|");
  if (ky === KY) {                // cùng bộ nút/dây: chỉ cập nhật màu, cỡ, trọng số — không xáo bố cục
    d.nut.forEach(n => Object.assign(NUT[n.id], n));
    d.day.forEach(l => { const o = DAY[l.source + ">" + l.target]; if (o) o.trong_so = l.trong_so; });
    veLoc(); return;
  }
  KY = ky;
  const cu = NUT; NUT = {}; DAY = {}; KE = {}; DONG_KE = {};
  const hub = d.nut.filter(n => n.nhom === "bo-phan");
  d.nut.forEach(n => {
    const o = cu[n.id];
    if (o) Object.assign(n, {x: o.x, y: o.y, fx: o.fx, fy: o.fy});
    NUT[n.id] = n; KE[n.id] = new Set();
  });
  Object.assign(NUT[TRUNG_TAM], {x: 0, y: 0, fx: 0, fy: 0});
  hub.forEach(n => { if (n.fx == null) { const g = -Math.PI / 2 + 2 * Math.PI * n.thu_tu / hub.length; n.fx = n.x = R_VONG * Math.cos(g); n.fy = n.y = R_VONG * Math.sin(g); } });
  d.nut.forEach(n => {
    if (n.x != null) return;
    const h = n.nhom === "thuc-the" ? {x: 0, y: 0} : NUT[n.bo_phan] || {x: 0, y: 0}, g = Math.random() * 6.2832;
    const r = n.nhom === "thuc-the" ? 200 + Math.random() * 220 : 30 + Math.random() * 90;
    n.x = h.x + r * Math.cos(g); n.y = h.y + r * Math.sin(g);
  });
  d.day.forEach(l => {
    DAY[l.source + ">" + l.target] = l;
    KE[l.source].add(l.target); KE[l.target].add(l.source);
    if (l.loai === "dong") [l.source, l.target].forEach(i => (DONG_KE[i] = DONG_KE[i] || []).push(l));
  });
  Object.values(DONG_KE).forEach(ds => ds.sort((a, b) => b.trong_so - a.trong_so));
  const bp = $("chon-bp");
  bp.innerHTML = `<option value="">Mọi bộ phận (${hub.length})</option>` + hub.sort((a, b) => a.thu_tu - b.thu_tu)
    .map(n => `<option value="${esc(n.id)}"${n.id === LOC.bp ? " selected" : ""}>${esc(n.ten)} — ${KE[n.id].size - 1} nơ-ron</option>`).join("");
  veLoc();
  G.graphData({nodes: d.nut, links: d.day});
  if (!DA_KHOP) setTimeout(() => khop(n => HIEN.has(n.id), 0), 30);
}

function veLoc() {
  const dn = {}, dm = {}, dd = {};
  Object.values(NUT).forEach(n => { dn[n.nhom] = (dn[n.nhom] || 0) + 1; dm[n.mau] = (dm[n.mau] || 0) + 1; });
  Object.values(DAY).forEach(l => { dd[l.loai] = (dd[l.loai] || 0) + 1; });
  $("loc-nhom").innerHTML = Object.entries(TEN_NHOM).map(([k, t]) => `<button class="chip loc${LOC.nhom.has(k) ? "" : " tat"}" data-nhom="${k}">${t} <b>${dn[k] || 0}</b></button>`).join("");
  $("loc-mau").innerHTML = Object.entries(TEN_MAU).map(([k, t]) =>
    `<button class="mau-dong${LOC.mau.has(k) ? "" : " tat"}" data-mau="${k}"><i style="background:${MAU[k]};box-shadow:0 0 8px ${MAU[k]}"></i>${t}<span>${dm[k] || 0}</span></button>`).join("");
  $("chu-day").innerHTML = Object.entries(TEN_DAY).map(([k, [t, m]]) => `<div class="mau-dong day"><i style="background:${k === "dong" ? MAU_DONG : m}"></i>${t}<span>${dd[k] || 0}</span></div>`).join("");
  const c = (DU && DU.dem) || {};
  $("tom").textContent = DU && !DU.co_kho ? "Chưa có kho nao/bo-phan.db — chạy «python -m core.nao_bo_phan gom»." :
    `${so(c.no_ron)} nơ-ron · ${so(c.thuc_the)} thực thể · ${so(c.dong)} dây đồng kích hoạt · dựng ${String((DU || {}).luc || "").slice(11, 16)}`;
  tinhHien();
}

function tinhHien() {
  const ok = n => LOC.nhom.has(n.nhom) && LOC.mau.has(n.mau) && (!LOC.bp || n.bo_phan === LOC.bp);
  HIEN = new Set(Object.values(NUT).filter(n => n.nhom === "trung-tam" || n.nhom === "bo-phan" || (n.nhom !== "thuc-the" && ok(n))).map(n => n.id));
  Object.values(NUT).forEach(n => {
    if (n.nhom === "thuc-the" && LOC.nhom.has("thuc-the") && LOC.mau.has("thuc-the") && [...KE[n.id]].some(i => HIEN.has(i) && NUT[i].nhom !== "bo-phan")) HIEN.add(n.id);
  });
  if (G) { G.nodeVisibility(n => HIEN.has(n.id)).linkVisibility(l => HIEN.has(ma(l.source)) && HIEN.has(ma(l.target))); ve(); }
}

function moLoc(n) {               // nút bị bộ lọc giấu → mở lọc cho nó hiện
  if (HIEN.has(n.id)) return;
  LOC.nhom.add(n.nhom); LOC.mau.add(n.mau);
  if (LOC.bp && n.bo_phan !== LOC.bp) { LOC.bp = ""; $("chon-bp").value = ""; }
  veLoc();
}

function tapTrung(n) {
  if (n.nhom === "bo-phan") khop(m => m.id === n.id || (m.bo_phan === n.id && HIEN.has(m.id)), 700);
  else if (n.nhom === "trung-tam") khop(m => HIEN.has(m.id), 700);
  else { G.centerAt(n.x, n.y, 700); G.zoom(2, 700); }
  chon(n);
}

function dauCt(n, tep, dau) {
  const mau = n ? MAU[n.mau] || "#94a3b8" : "#94a3b8", noron = n && n.nhom !== "bo-phan" && n.nhom !== "trung-tam";
  const tieu = !n ? tep : n.nhom === "loi" || n.nhom === "canh-bao" || n.nhom === "bai-hoc" ? n.cau || n.ten : n.ten;
  const chip = !n ? "" : [noron ? `<span class="chip" style="color:${mau};border-color:${rgba(mau, .4)}">${esc(TEN_MAU[n.mau] || TEN_NHOM[n.nhom] || "")}</span>` : "",
    noron && NUT[n.bo_phan] ? `<button class="chip tim" data-lk="${esc(n.bo_phan)}/so-tay">${esc(NUT[n.bo_phan].ten)}</button>` : "",
    n.nhom === "bo-phan" ? `<span class="chip ta">${so(n.su_kien_7)} sự kiện/7 ngày</span><span class="chip dich">${n.so_loi} lỗi đang cháy</span><button class="chip tim" data-lk="${esc(n.id)}/nhat-ky">nhật ký</button>` : "",
    ...(n.kenh || []).map(k => `<span class="chip xanh">${esc(k)}</span>`)].join("");
  const o = dau ? KHOA_SO.filter(([k]) => dau[k] != null && dau[k] !== "" && !(Array.isArray(dau[k]) && !dau[k].length))
    .map(([k, t]) => `<span>${t}</span><b>${esc(Array.isArray(dau[k]) ? dau[k].join(", ") : dau[k])}</b>`).join("") : "";
  return `<div class="ct-dau"><i style="background:${mau};box-shadow:0 0 10px ${mau}"></i><h3>${esc(tieu)}</h3></div>${chip ? `<div class="ct-chip">${chip}</div>` : ""}` +
    `${o ? `<div class="ct-so">${o}</div>` : ""}<div class="mo rat-nho ct-tep">nao/bo-phan/${esc(tep)}.md</div>`;
}

const RE_LK = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g;
const mdNot = than => MT.md(String(than || "").replace(/^\s*# .*\n?/, "")).replace(RE_LK, (_, dich, chu) => {
  const t = dich.trim().replace(/^bo-phan\//, "");
  return `<a href="#" class="lk" data-lk="${t}">${chu || t.split("/").pop()}</a>`;
});

async function chon(n, tep) {
  SEL = n ? n.id : null; KE_SEL = n ? new Set([n.id, ...(KE[n.id] || [])]) : new Set(); ve();
  if (!n && !tep) { $("phai").innerHTML = GOI_Y; return; }
  tep = tep || n.tep;
  const luot = ++LUOT;
  $("phai").innerHTML = dauCt(n, tep) + `<div class="trong">đang đọc nốt…</div>`;
  try {
    const d = await MT.taiJSON("/nao-bo-phan/no-ron.json?id=" + encodeURIComponent(tep));
    if (luot === LUOT) $("phai").innerHTML = dauCt(n, tep, d.dau) + mdNot(d.than);
  } catch (e) { if (luot === LUOT) $("phai").innerHTML = dauCt(n, tep) + `<div class="trong">không đọc được nốt: ${esc(e.message)}</div>`; }
}

// ── xung thần kinh ──
function ban(l, mau, nguoc) {     // một hạt chạy dọc dây (trần ~160 hạt đang bay cho máy không GPU)
  if (!l || MT.giamChuyenDong || BAN > 160 || !HIEN.has(ma(l.source)) || !HIEN.has(ma(l.target))) return;
  l.__mau = mau; l.__nguoc = !!nguoc; G.emitParticle(l); BAN++; setTimeout(() => BAN--, 1600);
}
function sang(n, mau) { if (n && HIEN.has(n.id)) { n.__sang = performance.now(); n.__mauSang = mau; ve(1700); } }

function phat(x) {
  NHIP.push(Date.now());
  themXung(x);
  const bp = NUT[x.bo_phan], mau = mauXung(x), nr = (x.no_ron || []).map(i => NUT[i]).filter(Boolean);
  if (!bp || !G) return;
  if (x.loai === "dung") {        // bài học được đưa vào lời nhắc: hạt xanh lơ chạy từ bài về bộ phận
    nr.forEach(n => { sang(n, mau); ban(DAY[n.bo_phan + ">" + n.id], mau, true); });
    setTimeout(() => sang(bp, mau), nr.length ? 650 : 0);
    return;
  }
  ban(DAY[TRUNG_TAM + ">" + bp.id], mau); sang(NUT[TRUNG_TAM], mau);
  setTimeout(() => {
    sang(bp, mau);
    nr.forEach(n => {
      ban(DAY[n.bo_phan + ">" + n.id], mau);
      setTimeout(() => { sang(n, mau); (DONG_KE[n.id] || []).slice(0, 3).forEach(l => ban(l, MAU_DONG, ma(l.target) === n.id)); }, 550);
    });
  }, 700);
}

const gio = luc => {
  const d = new Date(luc * 1000), h = new Date();
  return (d.toDateString() === h.toDateString() ? "" : `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")} `) + d.toTimeString().slice(0, d.toDateString() === h.toDateString() ? 8 : 5);
};
function themXung(x) {
  const hop = $("xung"), bp = NUT[x.bo_phan], mau = mauXung(x);
  if (hop.firstElementChild && hop.firstElementChild.classList.contains("trong")) hop.innerHTML = "";
  const d = document.createElement("div");
  d.className = "xung"; d.dataset.bp = x.bo_phan; d.dataset.nr = (x.no_ron || [])[0] || "";
  d.innerHTML = `<span class="gio">${gio(x.luc)}</span><i style="background:${mau};box-shadow:0 0 6px ${mau}"></i><b>${esc(bp ? bp.ten : x.bo_phan)}</b>` +
    `<span class="loai" style="color:${mau}">${esc(TEN_LOAI[x.loai] || x.loai)}</span><span class="chu">${esc((x.kenh ? "[" + x.kenh + "] " : "") + x.chu)}</span>`;
  hop.prepend(d);
  while (hop.children.length > 80) hop.lastChild.remove();
}

function nhip() { const moc = Date.now() - 60000; while (NHIP.length && NHIP[0] < moc) NHIP.shift(); return NHIP.length; }
function veDem() {
  const d = DEM || {}, n = d.ngu_cuoi || "";
  const o = [["Xung 24 giờ", so(d.su_kien_24h), "pulse", "var(--ta)"], ["Lỗi đang cháy", so(d.loi_dang), "alert", "var(--hong)"],
    ["Bài học đang dùng", so(d.bai_dang_dung), "book", "var(--tot)"], ["Giấc ngủ gần nhất", n ? `${n.slice(8, 10)}/${n.slice(5, 7)} ${n.slice(11, 16)}` : "chưa", "sparkles", "var(--tim)"],
    ["Xung / phút", so(nhip()), "zap", "var(--vang)"]];
  $("dem").innerHTML = o.map(([t, v, i, m]) => `<div class="o-dem"><div class="nhan"><span style="color:${m}">${ic(i)}</span>${t}</div><div class="gt" style="color:${m}">${v}</div></div>`).join("");
  $("nhip").textContent = `${nhip()} xung trong 60 giây · nghe mỗi 3 giây`;
}

async function nghe() {
  try {
    const d = await MT.taiJSON("/nao-bo-phan/song.json" + (CT ? `?tu=${CT.tu}&dung=${CT.dung}&ngu=${CT.ngu}` : ""));
    CT = d.con_tro; DEM = d.dem; MT.song(d.luc);
    const ds = (d.xung || []).slice(-60), buoc = ds.length ? Math.min(160, 2700 / ds.length) : 0;
    ds.forEach((x, i) => setTimeout(() => phat(x), i * buoc));
    const hop = $("xung");
    if (hop.firstElementChild && hop.firstElementChild.classList.contains("trong")) hop.firstElementChild.textContent =
      "chưa có xung trong 10 phút qua — đang nghe; sổ sự kiện về theo đợt gom, lời nhắc dùng bài về ngay";
  } catch (e) { MT.song(null, e.message); }
  veDem();
}

// ── tương tác bảng ──
$("loc-nhom").addEventListener("click", e => { const b = e.target.closest("[data-nhom]"); if (!b) return; const k = b.dataset.nhom; LOC.nhom.has(k) ? LOC.nhom.delete(k) : LOC.nhom.add(k); veLoc(); });
$("loc-mau").addEventListener("click", e => { const b = e.target.closest("[data-mau]"); if (!b) return; const k = b.dataset.mau; LOC.mau.has(k) ? LOC.mau.delete(k) : LOC.mau.add(k); veLoc(); });
$("chon-bp").addEventListener("change", e => { LOC.bp = e.target.value; tinhHien(); if (LOC.bp) tapTrung(NUT[LOC.bp]); else { khop(n => HIEN.has(n.id), 700); chon(null); } });
$("phai").addEventListener("click", e => {
  const a = e.target.closest("[data-lk]"); if (!a) return;
  e.preventDefault();
  const t = a.dataset.lk, n = NUT[t] || (t === "_ban-do" ? NUT[TRUNG_TAM] : t.endsWith("/so-tay") ? NUT[t.slice(0, -7)] : null);
  if (n) { moLoc(n); tapTrung(n); } else chon(null, t);
});
$("xung").addEventListener("click", e => {
  const r = e.target.closest(".xung"); if (!r) return;
  const n = NUT[r.dataset.nr] || NUT[r.dataset.bp]; if (n) { moLoc(n); tapTrung(n); }
});
const timKq = $("tim-kq");
let TIM = [];
$("tim").addEventListener("input", MT.doiCo(() => {
  const q = boDau($("tim").value.trim());
  TIM = q.length < 2 ? [] : Object.values(NUT).filter(n => (n.__tim = n.__tim || boDau([n.id, n.ten, n.cau, ...(n.kenh || [])].join(" "))).includes(q)).slice(0, 8);
  timKq.innerHTML = q.length < 2 ? "" : TIM.length ? TIM.map(n => `<button data-id="${esc(n.id)}"><i style="background:${MAU[n.mau] || "#94a3b8"}"></i>${esc(n.ten)}</button>`).join("") : `<div class="trong">không thấy</div>`;
}, 120));
$("tim").addEventListener("keydown", e => { if (e.key === "Enter" && TIM[0]) { moLoc(TIM[0]); tapTrung(TIM[0]); } });
timKq.addEventListener("click", e => { const b = e.target.closest("[data-id]"); const n = b && NUT[b.dataset.id]; if (n) { moLoc(n); tapTrung(n); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && SEL) chon(null); });

(async function batDau() {
  $("phai").innerHTML = GOI_Y;
  if (typeof ForceGraph !== "function") { MT.song(null, "thiếu /vendor/force-graph.min.js"); return; }
  try {
    const d = await MT.taiJSON("/nao-bo-phan/do-thi.json");
    taoG(); capNhat(d); DEM = d.dem; MT.song(d.luc); veDem();
  } catch (e) { MT.song(null, e.message); $("phai").innerHTML = `<div class="trong">không tải được đồ thị: ${esc(e.message)}</div>`; return; }
  await nghe();
  MT.lamMoi(nghe, 3000);
  MT.lamMoi(async () => { try { capNhat(await MT.taiJSON("/nao-bo-phan/do-thi.json")); } catch (e) { /* giữ đồ thị cũ */ } }, 300000);
})();
</script>
