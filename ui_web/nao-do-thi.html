  <li><b>Hạt sáng</b>: xung thần kinh thật từ sổ sự kiện, nghe 3 giây một lần — xanh lá thắng, đỏ lỗi/trượt, xanh lơ bài học vào lời nhắc, tím giấc ngủ.</li></ul></div>`;
}

function mauXung(x) {
  if (x.loai === "dung") return x.ket === "doi-chung" ? "#64748b" : "#22d3ee";
  if (x.loai === "ngu") return x.ket === "truot" ? "#f87171" : "#a78bfa";
  if (x.loai === "loi" || x.ket === "truot") return "#f87171";
  return x.ket === "thang" ? "#34d399" : x.ket === "trung_binh" ? "#fbbf24" : x.loai === "sua" ? "#60a5fa" : x.loai === "chon" ? "#2ee6c5" : "#9fb4d8";
}

function moTa(n) {
  if (n.nhom === "trung-tam") return "Bấm: bản đồ 15 bộ phận";
  if (n.nhom === "bo-phan") return `${so(n.su_kien_7)} sự kiện/7 ngày · ${n.so_loi} lỗi đang cháy · ${n.so_bai} bài học`;
  if (n.nhom === "thuc-the") return `${n.so_noi} nơ-ron nối vào`;
  return [TEN_MAU[n.mau] || n.trang_thai, (NUT[n.bo_phan] || {}).ten, (n.kenh || []).join(", "), n.so_lan != null ? `${so(n.so_lan)} lần` : ""].filter(Boolean).join(" · ");
}
const nhanNoi = n => `<b>${esc(hub(n) ? n.ten : n.cau || n.ten)}</b><div class="mo">${esc(moTa(n))}</div>`;

// vùng TRỐNG giữa các bảng HUD (bản phẳng phóng khít vào đây, bản 3D đặt tâm não vào giữa vùng này)
function khung(e) {
  const W = e.clientWidth, H = e.clientHeight, hep = W < 820, vua = W < 1180;
  const l = hep ? 16 : 296, r = W - (hep ? 16 : vua ? 344 : 396), t = vua ? 16 : 84, d = H - 162;
  return {W, H, l, r, t, d, cx: (l + r) / 2, cy: (t + d) / 2};
}

// ══ BẢN PHẲNG (force-graph 2D — dự phòng cho máy không WebGL, màn hẹp, hoặc người xem chọn) ══
let G = null, HET = 0, NGHI = true, DA_KHOP = false;

// vẽ lại trong `ms` tới (bản đồ đứng yên thì force-graph tự ngừng vẽ — đỡ CPU máy không GPU)
function ve(ms) { if (!G) return; HET = Math.max(HET, performance.now() + (ms || 80)); if (NGHI) { G.autoPauseRedraw(false); NGHI = false; } }

function veNen(ctx, k) {          // vòng quỹ đạo của các hub + quầng tím quanh não trung tâm
  ctx.save();
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R_VONG * .85);
  g.addColorStop(0, "rgba(124,58,237,.13)"); g.addColorStop(1, "rgba(124,58,237,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R_VONG * .85, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(167,139,250,.13)"; ctx.lineWidth = 1 / k; ctx.setLineDash([6 / k, 9 / k]);
  ctx.beginPath(); ctx.arc(0, 0, R_VONG, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

function veNut(n, ctx, k) {
  const r = n.kich_thuoc, mau = MAU[n.mau] || "#94a3b8", h = hub(n);
  const mo = SEL && !KE_SEL.has(n.id) ? .14 : 1;
  ctx.globalAlpha = mo;
  if (h) {
    const g = ctx.createRadialGradient(n.x, n.y, r * .3, n.x, n.y, r * 2.8);
    g.addColorStop(0, rgba(mau, .5)); g.addColorStop(1, rgba(mau, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, r * 2.8, 0, 6.2832); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832);
  ctx.fillStyle = h ? rgba(mau, .22) : mau; ctx.fill();
  if (h) { ctx.lineWidth = Math.max(1.5, 2.4 / k); ctx.strokeStyle = mau; ctx.stroke(); }
  if (n.id === SEL) { ctx.lineWidth = 2 / k; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(n.x, n.y, r + 3 / k, 0, 6.2832); ctx.stroke(); }
  const t = n.__sang ? (performance.now() - n.__sang) / 1600 : 1;
  if (t < 1) {                   // nơ-ron vừa cháy: quầng + vòng lan
    ctx.globalAlpha = mo * (1 - t);
    ctx.fillStyle = rgba(n.__mauSang, .35); ctx.beginPath(); ctx.arc(n.x, n.y, r * (1.3 + t * 1.5), 0, 6.2832); ctx.fill();
    ctx.lineWidth = 2 / k; ctx.strokeStyle = n.__mauSang; ctx.beginPath(); ctx.arc(n.x, n.y, r + 2 / k + t * r * 3, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = mo;
  }
  if (h || n.id === SEL || (mo === 1 && ((n.nhom !== "thuc-the" && k > 1.8) || k > 3.5))) {
    const c = h ? 13 : 10.5, chu = h || n.ten.length <= 34 ? n.ten : n.ten.slice(0, 33) + "…", y = n.y + r + 3 / k;
    ctx.font = `${h ? 700 : 500} ${c / k}px "Chakra Petch","Be Vietnam Pro",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
    ctx.lineWidth = 3 / k; ctx.strokeStyle = "rgba(4,8,15,.92)"; ctx.strokeText(chu, n.x, y);
    ctx.fillStyle = h ? "#eef3fb" : "#c3cee0"; ctx.fillText(chu, n.x, y);
    if (n.nhom === "bo-phan" && n.so_loi) {      // huy hiệu đỏ: số lỗi đang cháy của bộ phận
      const bx = n.x + r * .78, by = n.y - r * .78, br = 7 / k;
      ctx.fillStyle = "#f87171"; ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.2832); ctx.fill();
      ctx.font = `700 ${9 / k}px "Chakra Petch",sans-serif`; ctx.fillStyle = "#1a0505"; ctx.textBaseline = "middle"; ctx.fillText(String(n.so_loi), bx, by + .5 / k);
    }
  }
  ctx.globalAlpha = 1;
}

function veHat(x, y, l, ctx, k) {  // hạt xung: lõi sáng + quầng
  const m = l.__mau || "#2ee6c5";
  ctx.fillStyle = rgba(m, .28); ctx.beginPath(); ctx.arc(x, y, 9 / k, 0, 6.2832); ctx.fill();
  ctx.fillStyle = m; ctx.beginPath(); ctx.arc(x, y, 3.4 / k, 0, 6.2832); ctx.fill();
}

function mauDay(l) {
  if (!SEL) return l.loai === "dong" ? `rgba(251,191,36,${Math.min(.75, .14 + .05 * l.trong_so)})` : (TEN_DAY[l.loai] || TEN_DAY.the)[1];
  if (ma(l.source) !== SEL && ma(l.target) !== SEL) return "rgba(125,160,215,.03)";
  return l.loai === "dong" ? "rgba(251,191,36,.9)" : "rgba(233,213,255,.7)";
}

function taoG() {
  G = ForceGraph()(el)
    .width(el.clientWidth).height(el.clientHeight).backgroundColor("rgba(0,0,0,0)")
    .nodeId("id").nodeVal(n => n.kich_thuoc).nodeRelSize(1)
    .nodeLabel(nhanNoi)
    .nodeCanvasObject(veNut)
    .nodePointerAreaPaint((n, mau, ctx) => { ctx.fillStyle = mau; ctx.beginPath(); ctx.arc(n.x, n.y, n.kich_thuoc + 2, 0, 6.2832); ctx.fill(); })
    .linkColor(mauDay)
    .linkWidth(l => l.loai === "dong" ? Math.min(4, .6 + l.trong_so / 4) : l.loai === "goc" ? 1.6 : l.loai === "noi" ? 1.2 : .5)
    .linkCurvature(l => l.loai === "dong" ? .22 : l.loai === "noi" ? .3 : 0)
    .linkDirectionalParticleSpeed(l => (l.__nguoc ? -1 : 1) * (l.loai === "goc" ? .022 : .03))
    .linkDirectionalParticleCanvasObject(veHat)
    .d3AlphaDecay(.03).d3VelocityDecay(.38).warmupTicks(50).cooldownTicks(260).cooldownTime(9000)
    .onEngineStop(() => { if (!DA_KHOP) { DA_KHOP = true; khop(n => HIEN.has(n.id), 700); } })
    .onNodeClick(n => hub(n) ? tapTrung(n) : chon(n))
    .onBackgroundClick(() => chon(null))
    .onRenderFramePre(veNen)
    .onRenderFramePost(() => { if (!NGHI && performance.now() > HET) { G.autoPauseRedraw(true); NGHI = true; } });
  G.d3Force("center", null);
  G.d3Force("charge").strength(n => n.nhom === "thuc-the" ? -14 : hub(n) ? -120 : -(16 + n.kich_thuoc * 3)).distanceMax(240);
  G.d3Force("link")
    .distance(l => l.loai === "thuoc" ? 24 + (l.target.kich_thuoc || 4) * 2.6 : {goc: R_VONG, the: 80, noi: 40, dong: 120}[l.loai] || 60)
    .strength(l => l.loai === "dong" ? Math.min(.09, .015 * l.trong_so) : {goc: 0, thuoc: .55, the: .035, noi: .15}[l.loai] || .05);
}

// phóng khít các chấm lọc được vào vùng TRỐNG giữa các bảng HUD (không bị bảng che)
function khop(loc, ms) {
  const b = G.getGraphBbox(loc); if (!b) return;
  const {W, H, l, r, t, d} = khung(el);
  const k = Math.min(3.5, .92 * Math.min((r - l) / Math.max(40, b.x[1] - b.x[0]), (d - t) / Math.max(40, b.y[1] - b.y[0])));
  G.zoom(k, ms);
  G.centerAt((b.x[0] + b.x[1]) / 2 - ((l + r) / 2 - W / 2) / k, (b.y[0] + b.y[1]) / 2 - ((t + d) / 2 - H / 2) / k, ms);
}

const V2 = {
  ten: "2d",
  tao() { el.hidden = false; DA_KHOP = false; NGHI = true; taoG(); },
  dat(d, cu) {                    // giữ chỗ cũ; hub xếp trên vòng theo thứ tự dây chuyền; nơ-ron rải quanh hub
    const hs = d.nut.filter(n => n.nhom === "bo-phan");
    d.nut.forEach(n => { const o = cu[n.id]; if (o && o.x != null) Object.assign(n, {x: o.x, y: o.y, fx: o.fx, fy: o.fy}); });
    Object.assign(NUT[TRUNG_TAM], {x: 0, y: 0, fx: 0, fy: 0});
    hs.forEach(n => { if (n.fx == null) { const g = -Math.PI / 2 + 2 * Math.PI * n.thu_tu / hs.length; n.fx = n.x = R_VONG * Math.cos(g); n.fy = n.y = R_VONG * Math.sin(g); } });
    d.nut.forEach(n => {
      if (n.x != null) return;
      const h = n.nhom === "thuc-the" ? {x: 0, y: 0} : NUT[n.bo_phan] || {x: 0, y: 0}, g = Math.random() * 6.2832;
      const r = n.nhom === "thuc-the" ? 200 + Math.random() * 220 : 30 + Math.random() * 90;
      n.x = h.x + r * Math.cos(g); n.y = h.y + r * Math.sin(g);
    });
    G.graphData({nodes: d.nut, links: d.day});
    if (!DA_KHOP) setTimeout(() => khop(n => HIEN.has(n.id), 0), 30);
  },
  hien() { G.nodeVisibility(n => HIEN.has(n.id)).linkVisibility(l => HIEN.has(ma(l.source)) && HIEN.has(ma(l.target))); ve(); },
  ve(ms) { ve(ms); },
  lamMoi() { ve(); },
  tapTrung(n) {
    if (n.nhom === "bo-phan") khop(m => m.id === n.id || (m.bo_phan === n.id && HIEN.has(m.id)), 700);
    else if (n.nhom === "trung-tam") khop(m => HIEN.has(m.id), 700);
    else { G.centerAt(n.x, n.y, 700); G.zoom(2, 700); }
  },
  tongThe() { khop(n => HIEN.has(n.id), 700); },
  ban(l, mau, nguoc) {            // một hạt chạy dọc dây (trần ~160 hạt đang bay cho máy không GPU)
    if (!l || GIAM || this.bay > 160 || !HIEN.has(ma(l.source)) || !HIEN.has(ma(l.target))) return;
    l.__mau = mau; l.__nguoc = !!nguoc; G.emitParticle(l); this.bay++; setTimeout(() => this.bay--, 1600);
  },
  bay: 0,
  sang(n, mau) { if (n && HIEN.has(n.id)) { n.__sang = performance.now(); n.__mauSang = mau; ve(1700); } },
  doiCo() { G.width(el.clientWidth).height(el.clientHeight); },
  huy() { if (G) { G.pauseAnimation(); if (G._destructor) G._destructor(); } G = null; el.innerHTML = ""; el.hidden = true; },

// ══ BẢN 3D — 3d-force-graph 1.80.0 (MIT, https://github.com/vasturiano/3d-force-graph, vendored
//    /vendor/3d-force-graph.min.js) + three.js r183 (MIT, /vendor/three/ — UnrealBloomPass + OutputPass gắn vào
//    postProcessingComposer() theo mẫu example/bloom-effect; bay camera theo mẫu example/click-to-focus) ══
const rngTu = s => { let h = (s >>> 0) || 1; return () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; }; };
const bong = r => { let u, v, w; do { u = 2 * r() - 1; v = 2 * r() - 1; w = 2 * r() - 1; } while (u * u + v * v + w * w > 1); return [u, v, w]; };
const dai = v => Math.hypot(v[0], v[1], v[2]) || 1;
const chuan = v => { const l = dai(v); return [v[0] / l, v[1] / l, v[2] / l]; };
const cheo = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const banKinh = n => n.nhom === "trung-tam" ? 9 : n.nhom === "bo-phan" ? Math.min(12, 5 + 1.1 * Math.log1p(n.so_lan != null ? n.so_lan : n.su_kien_7 || 0))
  : n.nhom === "thuc-the" ? 1.3 + .55 * Math.log1p(n.so_noi || 0) : Math.min(7.5, 1.5 + 1.7 * Math.log1p(n.so_lan || 0));
const mauCua = n => n.nhom === "trung-tam" ? "#ece6ff" : n.nhom === "thuc-the" ? "#cbd5e1" : MAU_BP[n.bo_phan] || "#94a3b8";

// toạ độ chuẩn hoá ↔ "bán cầu": mỗi bán cầu là một khối bầu dục tâm z = ±0,5, nửa trục ngang 0,5; đáy phẳng hơn đỉnh
const yCo = (x, y) => y < 0 ? .68 - .08 * Math.max(0, x) : 1 - .16 * x * x;
function veBanCau(p) {            // kéo một điểm (chuẩn hoá) vào trong vỏ bán cầu của nó (≤ 0,9 bán kính)
  const h = p[2] < 0 ? -1 : 1, x = p[0], yl = p[1] / yCo(p[0], p[1]), zl = (Math.abs(p[2]) - .5) / .5, q = Math.hypot(x, yl, zl);
  if (q <= .9) return p;
  const k = .9 / q;
  return [x * k, yl * k * yCo(x * k, p[1]), h * (.5 + .5 * zl * k)];
}

    if (!this.raf) this.raf = requestAnimationFrame(this.vong);
  },

  matCham() {                     // chấm tròn mềm, cộng sáng (vỏ não + hạt xung) — cỡ theo khoảng cách camera
    const T = this.T;
    return new T.ShaderMaterial({
      uniforms: {uTi: this.uTi}, transparent: true, depthWrite: false, blending: T.AdditiveBlending,
      vertexShader: `attribute vec3 mau; attribute float kich; attribute float trong; uniform float uTi; varying vec3 vMau; varying float vTrong;
        void main() { vMau = mau; vTrong = trong; vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = trong > 0.0 ? clamp(kich * uTi / max(1.0, -mv.z), 1.0, 72.0) : 0.0; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying vec3 vMau; varying float vTrong;
        void main() { vec2 p = gl_PointCoord - 0.5; float d = dot(p, p) * 4.0; if (d > 1.0 || vTrong <= 0.0) discard;
          float a = vTrong * (1.0 - d) * (1.0 - d); gl_FragColor = vec4(vMau, a); }`,
    });
  },

  taoVo() {                        // mây hạt hình bộ não TỰ SINH: hai bán cầu có nếp cuộn + tiểu não + thân não (không mô hình có bản quyền)
    const T = this.T, rnd = rngTu(20261013), P = [], C = [], K = [], A = [], c = new T.Color(), tim = new T.Color("#8f7ef7"), lam = new T.Color("#5fb4f5");
    const nep = (x, y, z) => Math.sin(8.6 * x + 2.4 * Math.sin(5.1 * y + 1.3) + 1.6 * Math.sin(4.3 * z)) * Math.cos(7.4 * y + 2.1 * Math.sin(6.2 * x) - 1.1)
      + .45 * Math.sin(11.3 * z + 2.7 * Math.sin(4.7 * x + 3.1 * y));
    const them = (x, y, z, sang, kich) => {
      P.push(x * AX, y * AY, z * AZ);
      c.copy(tim).lerp(lam, Math.max(0, Math.min(1, .25 + .35 * x + .25 * (rnd() - .5)))).multiplyScalar(sang);
      C.push(c.r, c.g, c.b); K.push(kich * (.75 + .5 * rnd())); A.push(.55 + .45 * rnd());
    };
    for (const h of [-1, 1]) for (let i = 0, dem = 0; dem < 2500 && i < 90000; i++) {
      const u = rnd() * 2 - 1, g = rnd() * 6.2832, s = Math.sqrt(1 - u * u), dx = s * Math.cos(g), dy = u, dz = s * Math.sin(g);
      if (dz < -.2 && rnd() > .1) continue;                       // mặt trong sát khe giữa: thưa
      const f = nep(dx, dy, dz + h * .21), duong = Math.abs(f) < .2;
      if (!duong && rnd() > .14) continue;                         // điểm dồn thành đường nếp cuộn, còn lại rải thưa
      const r = 1 + .03 * f;
      let x = dx * r, y = dy * r, zl = dz * r * (dz < 0 ? .9 : 1);
      y *= yCo(x, y);
      if (dz > .15 && y < .12 && x > -.6 && x < .42) {            // thuỳ thái dương: phình ra ngoài, trễ xuống dưới
        const b = Math.sin((x + .6) / 1.02 * Math.PI);
        zl *= 1 + .1 * b; y -= .1 * b * Math.max(0, .12 - y) * 3;
      }
      x *= 1 - .05 * Math.max(0, y);
      if (dz > .25 && x > -.58 && x < .3 && Math.abs(y - (-.02 + .32 * (x + .58))) < .04) continue;   // rãnh bên (Sylvius)
      if (dy > .2 && Math.abs(x - (-.04 + .2 * (1 - dy))) < .028) continue;                       // rãnh trung tâm
      them(x, y, h * (.5 + .5 * zl), duong ? .46 : .24, duong ? 3.1 : 2.5); dem++;
    }
    for (let i = 0, dem = 0; dem < 650 && i < 30000; i++) {        // tiểu não: khối dẹt có vân ngang
      const u = rnd() * 2 - 1, g = rnd() * 6.2832, s = Math.sqrt(1 - u * u), dx = s * Math.cos(g), dy = u, dz = s * Math.sin(g);
      if (Math.abs(Math.sin(26 * dy + 2 * Math.sin(5 * dz))) > .45 || (dx < -.3 && rnd() > .3)) continue;
      them(.68 + .25 * dx, -.5 + .19 * dy, .55 * dz, .36, 2.6); dem++;
    }
    for (let i = 0; i < 220; i++) {                               // thân não
      const t = rnd(), g = rnd() * 6.2832, rr = .1 - .025 * t;
      them(.36 + .13 * t + rr * Math.cos(g) * .8, -.38 - .58 * t, rr * Math.sin(g) * 1.2, .26, 2.4);
    }
    const geo = new T.BufferGeometry();
    geo.setAttribute("position", new T.Float32BufferAttribute(P, 3)); geo.setAttribute("mau", new T.Float32BufferAttribute(C, 3));
    geo.setAttribute("kich", new T.Float32BufferAttribute(K, 1)); geo.setAttribute("trong", new T.Float32BufferAttribute(A, 1));
    const vo = new T.Points(geo, this.matCham()); vo.renderOrder = -1;
    this.soDiemVo = K.length;
    return vo;
  },

  taoHat() {                       // bể hạt xung cố định (1 lần vẽ cho mọi hạt): mỗi hạt = đầu sáng + 2 chấm đuôi
    const T = this.T, N = 160, M = N * 3, geo = new T.BufferGeometry();
    const b = {pos: new Float32Array(M * 3), mau: new Float32Array(M * 3), kich: new Float32Array(M), trong: new Float32Array(M)};
    for (const [k, v] of Object.entries(b)) geo.setAttribute(k === "pos" ? "position" : k, new T.BufferAttribute(v, k === "pos" || k === "mau" ? 3 : 1).setUsage(T.DynamicDrawUsage));
    const obj = new T.Points(geo, this.matCham()); obj.frustumCulled = false; obj.renderOrder = 2;
    return {obj, geo, b, N, o: new Array(N).fill(null), mau: Array.from({length: N}, () => new T.Color()), dang: false};
  },

  taoCham(n) {                     // chấm của một điều não đã học (lỗi: hình thoi · bài học / thực thể: tròn · bộ phận: cầu + quầng)
    const T = this.T, h = hub(n);
    const mat = new T.MeshBasicMaterial({transparent: true});
    const loi = new T.Mesh(h ? this.geo.lon : n.nhom === "loi" || n.nhom === "canh-bao" ? this.geo.thoi : this.geo.cau, mat);
    let obj = loi, quang = null;
    if (h) {
      quang = new T.Mesh(this.geo.lon, new T.MeshBasicMaterial({transparent: true, opacity: .1, depthWrite: false, blending: T.AdditiveBlending}));
      quang.scale.setScalar(2.3); obj = new T.Group(); obj.add(loi); obj.add(quang);
    }
    const c = {id: n.id, obj, mat, quang, nen: new T.Color()};
    this.cham.set(n.id, c);
    this.toCham(c, NUT[n.id] || n);
    return obj;
  },

  toCham(c, n) {                   // màu = bộ phận × độ sáng theo trạng thái; cỡ = số lần gặp/học; chọn thì làm mờ phần còn lại
    if (!n) return;
    const h = hub(n), s = doSang(n), mo = SEL && !KE_SEL.has(n.id);
    c.nen.set(mauCua(n)).multiplyScalar(n.nhom === "trung-tam" ? 1.05 : h ? .95 : HE_SANG[s] * (s === "sang" ? 1.3 : 1));
    c.mat.color.copy(c.nen);
    c.mat.opacity = h ? .9 : s === "mo" ? .5 : s === "vua" ? .82 : .96;
    if (mo) { c.mat.color.multiplyScalar(.22); c.mat.opacity *= .35; }
    if (n.id === SEL) c.mat.color.multiplyScalar(1.6);
    if (c.quang) { c.quang.material.color.copy(c.nen); c.quang.material.opacity = mo ? .03 : .1; }
    c.obj.scale.setScalar(banKinh(n) * (n.id === SEL && !h ? 1.4 : 1));
  },
  lamMoi() { this.cham.forEach(c => this.toCham(c, NUT[c.id])); this.veNhan(); },

  mauDay(l) {
    const s = ma(l.source), t = ma(l.target);
    if (SEL && s !== SEL && t !== SEL) return "rgba(120,140,190,0.02)";
    const k = SEL ? 2.6 : 1;
    if (l.loai === "goc") return rgba(MAU_BP[t] || "#a78bfa", Math.min(.9, .3 * k).toFixed(2));
    if (l.loai === "thuoc") return rgba(MAU_BP[s] || "#2ee6c5", Math.min(.8, .12 * k).toFixed(2));
    if (l.loai === "dong") return `rgba(251,191,36,${Math.min(.9, (.12 + .04 * l.trong_so) * k).toFixed(2)})`;
    if (l.loai === "noi") return `rgba(196,181,253,${Math.min(.9, .45 * k).toFixed(2)})`;
    return `rgba(203,213,225,${Math.min(.6, .04 * k * k).toFixed(2)})`;
  },

  nhaCua(n, dem) {                 // "nhà" của một chấm: một mảng vỏ não quanh tâm thuỳ (ổn định theo mã — tải lại vẫn đúng chỗ)
    const r = rngTu(MT.bam(n.id)), [u, v, w] = bong(r);
    if (n.nhom === "thuc-the") return [u * .3 * AX, (.06 + .14 * v) * AY, .1 * w * AZ];        // lõi trắng giữa não
    const p = VI_TRI[n.bo_phan] || [0, 0, 0], c = [p[0] * AX, p[1] * AY, p[2] * AZ], a = 20 + 11 * Math.cbrt(dem[n.bo_phan] || 1);
    if (SAU.has(n.bo_phan)) return [c[0] + u * a * .8, c[1] + v * a * .6, c[2] + w * a * .8];
    const hz = p[2] < 0 ? -1 : 1, zl = (Math.abs(p[2]) - .5) / .5;
    const nm = chuan([p[0] / AX, p[1] / yCo(p[0], p[1]) / AY, hz * zl / (.5 * AZ)]);
    const t1 = chuan(Math.abs(nm[1]) > .9 ? cheo(nm, [1, 0, 0]) : cheo(nm, [0, 1, 0])), t2 = cheo(nm, t1);
    const q = [0, 1, 2].map(i => c[i] + (t1[i] * u + t2[i] * v) * a + nm[i] * w * a * .42);
    const k = veBanCau([q[0] / AX, q[1] / AY, q[2] / AZ]);
    return [k[0] * AX, k[1] * AY, k[2] * AZ];
  },

  dat(d, cu) {
    this.ds = d.nut;
    const dem = {};
    d.nut.forEach(n => { if (!hub(n) && n.bo_phan) dem[n.bo_phan] = (dem[n.bo_phan] || 0) + 1; });
    d.nut.forEach(n => {
      if (n.nhom === "trung-tam") { n.fx = n.x = 0; n.fy = n.y = 0; n.fz = n.z = 0; return; }
      if (n.nhom === "bo-phan") { const p = VI_TRI[n.id] || [0, 0, 0]; n.fx = n.x = p[0] * AX; n.fy = n.y = p[1] * AY; n.fz = n.z = p[2] * AZ; return; }
      n.__nha = this.nhaCua(n, dem);
      const o = cu[n.id];
      if (o && o.z != null) { n.x = o.x; n.y = o.y; n.z = o.z; } else { n.x = n.__nha[0]; n.y = n.__nha[1]; n.z = n.__nha[2]; }
    });
    const nhieu = d.nut.length > 1000;            // > ~1.000 chấm: tắt hào quang, ít hạt
    this.bloom.enabled = !nhieu && !this.tatBloom; this.tran = nhieu ? 40 : GIAM ? 30 : 160;
    this.G.graphData({nodes: d.nut, links: d.day});
    this.veNhan();
    if (!this.daNhin) { this.daNhin = true; this.veNha(0); }
  },

  hien() {
    this.G.nodeVisibility(n => HIEN.has(n.id)).linkVisibility(l => HIEN.has(ma(l.source)) && HIEN.has(ma(l.target)));
    this.veNhan();
  },
  ve() { this.lamMoi(); this.G.linkColor(l => this.mauDay(l)); },

  veNhan() {                       // nhãn HTML cho 15 bộ phận + não trung tâm + chấm đang chọn
    const hs = Object.values(NUT).filter(hub).sort((a, b) => (a.thu_tu ?? -1) - (b.thu_tu ?? -1));
    lop3.innerHTML = hs.map(n => `<button type="button" class="nh3${n.nhom === "trung-tam" ? " tt" : ""}" data-id="${esc(n.id)}" style="--m:${mauCua(n)}">` +
      `<i></i>${esc(n.ten)}${n.so_loi ? `<b title="lỗi đang cháy">${n.so_loi}</b>` : ""}</button>`).join("") + `<div class="nh3 chon" id="nh3-chon" hidden></div>`;
    this.nhan = [...lop3.querySelectorAll("[data-id]")].map(e => ({e, id: e.dataset.id}));
    const n = SEL && NUT[SEL];
    this.nhanChon = $("nh3-chon");
    if (n && !hub(n)) { this.nhanChon.textContent = n.ten; this.nhanChon.hidden = false; }
  },

  capNhan() {                      // mỗi khung: chiếu nhãn theo camera; xa thì mờ, khuất sau camera thì ẩn
    if (!this.T || !this.G) return;
    const cam = this.G.camera(), W = el3.clientWidth, H = el3.clientHeight, v = this.v || (this.v = new this.T.Vector3());
    const dT = cam.position.distanceTo(this.ctl.target), dat = (e, n, duoi) => {
      if (!n || !HIEN.has(n.id)) { e.style.visibility = "hidden"; return; }
      v.set(n.x || 0, n.y || 0, n.z || 0);
      const d = cam.position.distanceTo(v);
      v.project(cam);
      if (v.z > 1 || v.x < -1.2 || v.x > 1.2 || v.y < -1.2 || v.y > 1.2) { e.style.visibility = "hidden"; return; }
      const r = banKinh(n) * this.uTi.value / this.pr / Math.max(1, d);
      e.style.visibility = "visible";
      e.style.transform = `translate(${((v.x + 1) / 2 * W).toFixed(1)}px,${((1 - v.y) / 2 * H + r * duoi + 3).toFixed(1)}px) translateX(-50%)`;
      e.style.opacity = SEL && !KE_SEL.has(n.id) ? .25 : Math.max(.35, Math.min(1, 1.15 - (d - dT) / (AX * 1.8))).toFixed(2);
    };
    for (const o of this.nhan) dat(o.e, NUT[o.id], 1.2);
    if (this.nhanChon && !this.nhanChon.hidden) dat(this.nhanChon, NUT[SEL], 1.6);
  },

  moiKhung(now) {                  // vòng của trang: hạt xung, chấm loé, nhãn, đo khung hình
    this.capHat(now);
    for (const id of this.sangDs) {
      const n = NUT[id], c = this.cham.get(id);
      const t = n && n.__sang ? (now - n.__sang) / 1500 : 1;
      if (!c || t >= 1) { this.sangDs.delete(id); if (c) this.toCham(c, n); continue; }
      const e = 1 - t;
      this.toCham(c, n);
      c.mat.color.lerp(this.mauTam.set(n.__mauSang).multiplyScalar(2.2), .85 * e);
      c.mat.opacity = Math.max(c.mat.opacity, .96 * e);
      c.obj.scale.multiplyScalar(1 + (GIAM ? .3 : .9) * e);
      if (c.quang) c.quang.material.opacity = .1 + .35 * e;
    }
    this.capNhan();
    if (document.hidden) { this.moc = now; this.dem = 0; return; }
    this.dem = (this.dem || 0) + 1;
    if (!this.moc) this.moc = now;
    if (now - this.moc >= 1000) {
      this.fps = this.dem * 1000 / (now - this.moc); this.dem = 0; this.moc = now;
      window.__nao3d = {fps: Math.round(this.fps), hao_quang: this.bloom.enabled, cham: this.cham.size, diem_vo: this.soDiemVo, hat: this.hat.o.filter(Boolean).length};
      // máy yếu (GL phần mềm): < 22 khung/giây suốt 4 giây → tắt hào quang + hạ độ nét; vẫn < 9 suốt 5 giây → về
      // bản phẳng và nhớ "cham" (người xem đã tự bấm Xem 3D thì chỉ tắt hào quang, không tự đổi)
      const som = now - this.batDau > 6000;
      this.cham4 = som && this.fps < 22 ? this.cham4 + 1 : 0;
      if (CHAT_CAO || !som) return;
      if (this.bloom.enabled && this.cham4 >= 4) {
        this.tatBloom = true; this.bloom.enabled = false; this.pr = 1; this.cham4 = 0; this.batDau = now;
        this.G.renderer().setPixelRatio(1); this.G.postProcessingComposer().setPixelRatio(1); this.capTi();
        capNut();
      } else if (!this.bloom.enabled && this.cham4 >= 5 && this.fps < 9 && docChe() !== "3d") {
        luuChe("cham"); TU_DONG = false;
        LY_DO_2D = `Máy vẽ 3D quá chậm (${Math.round(this.fps)} khung/giây) nên đang xem phẳng — bấm để thử lại 3D`;
        setTimeout(() => doiChe("2d"), 0);
      }
    }
  },
  ban(l, mau, nguoc) {             // một hạt xung chạy dọc mối nối (giữa hai chấm đang hiện; có trần số hạt bay cùng lúc)
    const h = this.hat;
    if (!l || !h || !HIEN.has(ma(l.source)) || !HIEN.has(ma(l.target))) return;
    let bay = 0, cho = -1;
    for (let i = 0; i < h.N; i++) { if (h.o[i]) bay++; else if (cho < 0) cho = i; }
    if (cho < 0 || bay >= this.tran) return;
    const s = l.source, t = l.target, len = Math.hypot((t.x || 0) - (s.x || 0), (t.y || 0) - (s.y || 0), (t.z || 0) - (s.z || 0));
    h.o[cho] = {l, t0: performance.now(), dur: Math.max(450, Math.min(1300, 350 + len * 2.2)), nguoc: !!nguoc};
    h.mau[cho].set(mau).multiplyScalar(1.8); h.dang = true;
  },

  capHat(now) {
    const h = this.hat; if (!h || !h.dang) return;
    const {pos, mau, kich, trong} = h.b;
    let con = 0;
    for (let i = 0; i < h.N; i++) {
      const s = h.o[i];
      const t = s ? (now - s.t0) / s.dur : 1;
      if (!s || t >= 1) { h.o[i] = null; trong[i * 3] = trong[i * 3 + 1] = trong[i * 3 + 2] = 0; continue; }
      con++;
      const a = s.l.source, b = s.l.target, cv = s.l.__curve, mo = Math.min(1, t * 6, (1 - t) * 5);
      for (let k = 0; k < 3; k++) {
        const j = i * 3 + k, tk = Math.max(0, t - k * .05), u = s.nguoc ? 1 - tk : tk;
        if (cv && cv.getPoint) { const p = cv.getPoint(u); pos[j * 3] = p.x; pos[j * 3 + 1] = p.y; pos[j * 3 + 2] = p.z; }
        else { pos[j * 3] = a.x + (b.x - a.x) * u; pos[j * 3 + 1] = a.y + (b.y - a.y) * u; pos[j * 3 + 2] = a.z + (b.z - a.z) * u; }
        mau[j * 3] = h.mau[i].r; mau[j * 3 + 1] = h.mau[i].g; mau[j * 3 + 2] = h.mau[i].b;
        kich[j] = k ? 6.5 - k * 1.8 : 8.5; trong[j] = (k ? .5 - k * .15 : 1) * mo;
      }
    }
    for (const k of ["position", "mau", "kich", "trong"]) h.geo.attributes[k].needsUpdate = true;
    h.dang = con > 0;
  },

  sang(n, mau) { if (n && HIEN.has(n.id) && this.cham.has(n.id)) { n.__sang = performance.now(); n.__mauSang = mau; this.sangDs.add(n.id); } },

  nghiXoay(ms) {                   // người xem đang dùng → ngừng tự xoay; rảnh `ms` (và không chọn gì) thì xoay chậm lại
    if (!this.ctl) return;
    this.ctl.autoRotate = false; clearTimeout(this.henXoay);
    if (!GIAM) this.henXoay = setTimeout(() => { if (this.ctl && !SEL) this.ctl.autoRotate = true; else if (this.ctl) this.nghiXoay(ms); }, ms || 25000);
  },

  datLech() {                      // tâm não ở giữa vùng trống giữa các bảng HUD (lệch ống kính, không lệch cảnh)
    const k = khung(el3), cam = this.G.camera(), ox = k.W / 2 - k.cx, oy = k.H / 2 - k.cy;
    if (Math.abs(ox) + Math.abs(oy) < 1) cam.clearViewOffset(); else cam.setViewOffset(k.W, k.H, ox, oy, k.W, k.H);
  },
  capTi() { const cam = this.G.camera(); this.uTi.value = el3.clientHeight * this.G.renderer().getPixelRatio() / (2 * Math.tan(cam.fov * Math.PI / 360)); },

  veNha(ms) {                      // nhìn toàn não từ bên phải-trước, hơi cao (trán bên trái màn hình)
    const cam = this.G.camera(), k = khung(el3), tv = Math.tan(cam.fov * Math.PI / 360);
    const fh = Math.max(.3, (k.d - k.t) / k.H), fw = Math.max(.3, (k.r - k.l) / k.W), asp = k.W / Math.max(1, k.H);
    const dist = Math.max(240 / (tv * fh), 340 / (tv * asp * fw)) + AZ * .35, h = chuan([-.42, .5, 1]);
    this.G.cameraPosition({x: h[0] * dist, y: h[1] * dist, z: h[2] * dist}, {x: 0, y: 0, z: 0}, GIAM ? 0 : ms);
  },

  tapTrung(n) {                    // bay tới chấm / thuỳ (mẫu click-to-focus: đứng ngoài nhìn vào)
    this.nghiXoay(45000);
    if (n.nhom === "trung-tam") return this.veNha(1200);
    const ds = n.nhom === "bo-phan" ? Object.values(NUT).filter(m => m.id === n.id || (m.bo_phan === n.id && !hub(m) && HIEN.has(m.id))) : [n];
    const c = [0, 1, 2].map(i => ds.reduce((s, m) => s + (m[["x", "y", "z"][i]] || 0), 0) / ds.length);
    const rho = Math.max(25, ...ds.map(m => Math.hypot((m.x || 0) - c[0], (m.y || 0) - c[1], (m.z || 0) - c[2])));
    const cam = this.G.camera(), tg = this.ctl.target, nhin = chuan([cam.position.x - tg.x, cam.position.y - tg.y, cam.position.z - tg.z]);
    const ra = chuan(c), sau = dai(c) < 95;   // thuỳ nằm sâu giữa não: giữ hướng nhìn hiện tại; còn lại đứng ngoài vỏ nhìn vào
    const h = sau ? nhin : n.nhom === "bo-phan" ? ra : chuan([ra[0] * 2 + nhin[0], ra[1] * 2 + nhin[1], ra[2] * 2 + nhin[2]]);
    const dist = n.nhom === "bo-phan" ? rho * 2.3 + 150 : 150 + banKinh(n) * 6;
    this.G.cameraPosition({x: c[0] + h[0] * dist, y: c[1] + h[1] * dist, z: c[2] + h[2] * dist}, {x: c[0], y: c[1], z: c[2]}, GIAM ? 0 : 1300);
  },
  tongThe() { this.veNha(1000); },
  doiCo() { this.G.width(el3.clientWidth).height(el3.clientHeight); this.datLech(); this.capTi(); },

  huy() {
    cancelAnimationFrame(this.raf); this.raf = 0; clearTimeout(this.henXoay); this.dungVe = false;
    if (this.io) { this.io.disconnect(); this.io = null; }
    if (this.G) {
      try { const r = this.G.renderer(); this.G._destructor(); r.forceContextLoss(); } catch (e) { /* đã huỷ */ }
      Object.values(this.geo || {}).forEach(g => g.dispose());
    }
    this.G = this.ctl = this.hat = this.vo = null; this.nhan = []; this.nhanChon = null; this.cham.clear(); this.sangDs.clear(); this.ds = null;
    el3.innerHTML = ""; lop3.innerHTML = ""; el3.hidden = lop3.hidden = true; $("san").classList.remove("che-3d");
  },
};

// ══ chung cho hai bản ══
function capNhat(d) {
  DU_GOC = JSON.stringify(d);     // bản sạch để dựng lại khi đổi 3D ↔ phẳng (thư viện gắn thêm trường vào chấm/dây)
  DU = d;
  const ky = d.nut.map(n => n.id).sort().join("|") + "#" + d.day.map(l => l.source + ">" + l.target).sort().join("|");
  if (ky === KY) {                // cùng bộ chấm/dây: chỉ cập nhật màu, cỡ, trọng số — không xáo bố cục
    d.nut.forEach(n => Object.assign(NUT[n.id], n));
    d.day.forEach(l => { const o = DAY[l.source + ">" + l.target]; if (o) o.trong_so = l.trong_so; });
    veLoc(); if (V) V.lamMoi(); return;
  }
  KY = ky;
  const cu = NUT; NUT = {}; DAY = {}; KE = {}; DONG_KE = {};
  d.nut.forEach(n => { NUT[n.id] = n; KE[n.id] = new Set(); });
  d.day.forEach(l => {
    DAY[l.source + ">" + l.target] = l;
    KE[l.source].add(l.target); KE[l.target].add(l.source);
    if (l.loai === "dong") [l.source, l.target].forEach(i => (DONG_KE[i] = DONG_KE[i] || []).push(l));
  });
  Object.values(DONG_KE).forEach(ds => ds.sort((a, b) => b.trong_so - a.trong_so));
  const hs = d.nut.filter(n => n.nhom === "bo-phan").sort((a, b) => a.thu_tu - b.thu_tu);
  $("chon-bp").innerHTML = `<option value="">Mọi bộ phận (${hs.length})</option>` +
    hs.map(n => `<option value="${esc(n.id)}"${n.id === LOC.bp ? " selected" : ""}>${esc(n.ten)} — ${KE[n.id].size - 1} nơ-ron</option>`).join("");
  if (SEL && !NUT[SEL]) { SEL = null; KE_SEL = new Set(); }
  else if (SEL) KE_SEL = new Set([SEL, ...KE[SEL]]);
  veLoc();
  if (V) V.dat(d, cu);
}

function veLoc() {
  const dn = {}, dm = {}, dd = {}, db = {}, ba = V && V.ten === "3d";
  Object.values(NUT).forEach(n => { dn[n.nhom] = (dn[n.nhom] || 0) + 1; dm[n.mau] = (dm[n.mau] || 0) + 1; if (!hub(n) && n.bo_phan) db[n.bo_phan] = (db[n.bo_phan] || 0) + 1; });
  Object.values(DAY).forEach(l => { dd[l.loai] = (dd[l.loai] || 0) + 1; });
  $("loc-nhom").innerHTML = Object.entries(TEN_NHOM).map(([k, t]) => `<button class="chip loc${LOC.nhom.has(k) ? "" : " tat"}" data-nhom="${k}">${t} <b>${dn[k] || 0}</b></button>`).join("");
  $("nhan-loc-mau").textContent = ba ? "Trạng thái = độ sáng — bấm để ẩn / hiện" : "Trạng thái — bấm để ẩn / hiện";
  $("loc-mau").innerHTML = Object.entries(TEN_MAU).map(([k, t]) => {
    const s = k === "canh-bao" || k === "thuc-the" ? "vua" : MUC_SANG[k] || "vua", a = HE_SANG[s];
    const cham = ba ? `background:rgba(236,240,248,${(.25 + .75 * a).toFixed(2)});box-shadow:0 0 ${s === "sang" ? 9 : 3}px rgba(236,240,248,${a})` : `background:${MAU[k]};box-shadow:0 0 8px ${MAU[k]}`;
    return `<button class="mau-dong${LOC.mau.has(k) ? "" : " tat"}" data-mau="${k}" title="${ba ? "độ sáng: " + TEN_SANG[s] : ""}"><i style="${cham}"></i>${t}<span>${dm[k] || 0}</span></button>`;
  }).join("");
  $("nhan-bp-mau").hidden = $("chu-bp").hidden = !ba;
  if (ba) $("chu-bp").innerHTML = Object.values(NUT).filter(n => n.nhom === "bo-phan").sort((a, b) => a.thu_tu - b.thu_tu).map(n =>
    `<button class="mau-dong bp" data-bp="${esc(n.id)}" title="${esc(n.ten)} — ${db[n.id] || 0} điều đã học"><i style="background:${MAU_BP[n.id] || "#94a3b8"};box-shadow:0 0 7px ${MAU_BP[n.id] || "#94a3b8"}"></i><em>${esc(n.ten)}</em></button>`).join("");
  $("chu-day").innerHTML = Object.entries(TEN_DAY).map(([k, [t, m]]) => `<div class="mau-dong day"><i style="background:${k === "dong" ? MAU_DONG : ba && (k === "goc" || k === "thuoc") ? "linear-gradient(90deg,#f59e0b,#ec4899,#0ea5e9,#10b981)" : m}"></i>${t}<span>${dd[k] || 0}</span></div>`).join("");
  const c = (DU && DU.dem) || {};
  $("tom").textContent = DU && !DU.co_kho ? "Chưa có kho nao/bo-phan.db — chạy «python -m core.nao_bo_phan gom»." :
    `${so(c.no_ron)} nơ-ron · ${so(c.thuc_the)} thực thể · ${so(c.dong)} dây đồng kích hoạt · dựng ${String((DU || {}).luc || "").slice(11, 16)}` +
    (ba ? " · cỡ chấm = số lần gặp / học" : "");
  tinhHien();
}

function tinhHien() {
  const ok = n => LOC.nhom.has(n.nhom) && LOC.mau.has(n.mau) && (!LOC.bp || n.bo_phan === LOC.bp);
  HIEN = new Set(Object.values(NUT).filter(n => hub(n) || (n.nhom !== "thuc-the" && ok(n))).map(n => n.id));
  Object.values(NUT).forEach(n => {
    if (n.nhom === "thuc-the" && LOC.nhom.has("thuc-the") && LOC.mau.has("thuc-the") && [...KE[n.id]].some(i => HIEN.has(i) && NUT[i].nhom !== "bo-phan")) HIEN.add(n.id);
  });
  if (V) V.hien();
}

function moLoc(n) {               // chấm bị bộ lọc giấu → mở lọc cho nó hiện
  if (HIEN.has(n.id)) return;
  LOC.nhom.add(n.nhom); LOC.mau.add(n.mau);
  if (LOC.bp && n.bo_phan !== LOC.bp) { LOC.bp = ""; $("chon-bp").value = ""; }
  veLoc();
}

function tapTrung(n) { if (V) V.tapTrung(n); chon(n); }

function dauCt(n, tep, dau) {
  const mau = n ? MAU[n.mau] || "#94a3b8" : "#94a3b8", noron = n && !hub(n);
  const tieu = !n ? tep : n.nhom === "loi" || n.nhom === "canh-bao" || n.nhom === "bai-hoc" ? n.cau || n.ten : n.ten;
  const chip = !n ? "" : [noron ? `<span class="chip" style="color:${mau};border-color:${rgba(mau, .4)}">${esc(TEN_MAU[n.mau] || TEN_NHOM[n.nhom] || "")}</span>` : "",
    noron && NUT[n.bo_phan] ? `<button class="chip tim" data-lk="${esc(n.bo_phan)}/so-tay">${esc(NUT[n.bo_phan].ten)}</button>` : "",
    n.nhom === "bo-phan" ? `<span class="chip ta">${so(n.su_kien_7)} sự kiện/7 ngày</span><span class="chip dich">${n.so_loi} lỗi đang cháy</span><button class="chip tim" data-lk="${esc(n.id)}/nhat-ky">nhật ký</button>` : "",
    ...(n.kenh || []).map(k => `<span class="chip xanh">${esc(k)}</span>`)].join("");
  const o = dau ? KHOA_SO.filter(([k]) => dau[k] != null && dau[k] !== "" && !(Array.isArray(dau[k]) && !dau[k].length))
    .map(([k, t]) => `<span>${t}</span><b>${esc(Array.isArray(dau[k]) ? dau[k].join(", ") : dau[k])}</b>`).join("") : "";
  return `<div class="ct-dau"><i style="background:${mau};box-shadow:0 0 10px ${mau}"></i><h3>${esc(tieu)}</h3></div>${chip ? `<div class="ct-chip">${chip}</div>` : ""}` +
    `${o ? `<div class="ct-so">${o}</div>` : ""}<div class="mo rat-nho ct-tep">nao/bo-phan/${esc(tep)}.md</div>`;
}

const RE_LK = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g;
const mdNot = than => MT.md(String(than || "").replace(/^\s*# .*\n?/, "")).replace(RE_LK, (_, dich, chu) => {
  const t = dich.trim().replace(/^bo-phan\//, "");
  return `<a href="#" class="lk" data-lk="${t}">${chu || t.split("/").pop()}</a>`;
});

async function chon(n, tep) {
  SEL = n ? n.id : null; KE_SEL = n ? new Set([n.id, ...(KE[n.id] || [])]) : new Set();
  if (V) { V.ve(); if (V.ten === "3d" && !n) V.nghiXoay(15000); }
  if (!n && !tep) { $("phai").innerHTML = goiY(); return; }
  tep = tep || n.tep;
  const luot = ++LUOT;
  $("phai").innerHTML = dauCt(n, tep) + `<div class="trong">đang đọc nốt…</div>`;
  try {
    const d = await MT.taiJSON("/nao-bo-phan/no-ron.json?id=" + encodeURIComponent(tep));
    if (luot === LUOT) $("phai").innerHTML = dauCt(n, tep, d.dau) + mdNot(d.than);
  } catch (e) { if (luot === LUOT) $("phai").innerHTML = dauCt(n, tep) + `<div class="trong">không đọc được nốt: ${esc(e.message)}</div>`; }
}

// ── xung thần kinh ──
const ban = (l, mau, nguoc) => { if (V) V.ban(l, mau, nguoc); };
const sang = (n, mau) => { if (V) V.sang(n, mau); };

function phat(x) {
  NHIP.push(Date.now());
  themXung(x);
  const bp = NUT[x.bo_phan], mau = mauXung(x), nr = (x.no_ron || []).map(i => NUT[i]).filter(Boolean);
  if (!bp || !V) return;
  if (x.loai === "dung") {        // bài học được đưa vào lời nhắc: hạt xanh lơ chạy từ bài về bộ phận
    nr.forEach(n => { sang(n, mau); ban(DAY[n.bo_phan + ">" + n.id], mau, true); });
    setTimeout(() => sang(bp, mau), nr.length ? 650 : 0);
    return;
  }
  ban(DAY[TRUNG_TAM + ">" + bp.id], mau); sang(NUT[TRUNG_TAM], mau);
  setTimeout(() => {
    sang(bp, mau);
    nr.forEach(n => {
      ban(DAY[n.bo_phan + ">" + n.id], mau);
      setTimeout(() => { sang(n, mau); (DONG_KE[n.id] || []).slice(0, 3).forEach(l => ban(l, MAU_DONG, ma(l.target) === n.id)); }, 550);
    });
  }, 700);
}

const gio = luc => {
  const d = new Date(luc * 1000), h = new Date();
  return (d.toDateString() === h.toDateString() ? "" : `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")} `) + d.toTimeString().slice(0, d.toDateString() === h.toDateString() ? 8 : 5);
};
function themXung(x) {
  const hop = $("xung"), bp = NUT[x.bo_phan], mau = mauXung(x);
  if (hop.firstElementChild && hop.firstElementChild.classList.contains("trong")) hop.innerHTML = "";
  const d = document.createElement("div");
  d.className = "xung"; d.dataset.bp = x.bo_phan; d.dataset.nr = (x.no_ron || [])[0] || "";
  d.innerHTML = `<span class="gio">${gio(x.luc)}</span><i style="background:${mau};box-shadow:0 0 6px ${mau}"></i><b>${esc(bp ? bp.ten : x.bo_phan)}</b>` +
    `<span class="loai" style="color:${mau}">${esc(TEN_LOAI[x.loai] || x.loai)}</span><span class="chu">${esc((x.kenh ? "[" + x.kenh + "] " : "") + x.chu)}</span>`;
  hop.prepend(d);
  while (hop.children.length > 80) hop.lastChild.remove();
}

function nhip() { const moc = Date.now() - 60000; while (NHIP.length && NHIP[0] < moc) NHIP.shift(); return NHIP.length; }
function veDem() {
  const d = DEM || {}, n = d.ngu_cuoi || "";
  const o = [["Xung 24 giờ", so(d.su_kien_24h), "pulse", "var(--ta)"], ["Lỗi đang cháy", so(d.loi_dang), "alert", "var(--hong)"],
    ["Bài học đang dùng", so(d.bai_dang_dung), "book", "var(--tot)"], ["Giấc ngủ gần nhất", n ? `${n.slice(8, 10)}/${n.slice(5, 7)} ${n.slice(11, 16)}` : "chưa", "sparkles", "var(--tim)"],
    ["Xung / phút", so(nhip()), "zap", "var(--vang)"]];
  $("dem").innerHTML = o.map(([t, v, i, m]) => `<div class="o-dem"><div class="nhan"><span style="color:${m}">${ic(i)}</span>${t}</div><div class="gt" style="color:${m}">${v}</div></div>`).join("");
  $("nhip").textContent = `${nhip()} xung trong 60 giây · nghe mỗi 3 giây`;
}

async function nghe() {
  try {
    const d = await MT.taiJSON("/nao-bo-phan/song.json" + (CT ? `?tu=${CT.tu}&dung=${CT.dung}&ngu=${CT.ngu}` : ""));
    CT = d.con_tro; DEM = d.dem; MT.song(d.luc);
    const ds = (d.xung || []).slice(-60), buoc = ds.length ? Math.min(160, 2700 / ds.length) : 0;
    ds.forEach((x, i) => setTimeout(() => phat(x), i * buoc));
    const hop = $("xung");
    if (hop.firstElementChild && hop.firstElementChild.classList.contains("trong")) hop.firstElementChild.textContent =
      "chưa có xung trong 10 phút qua — đang nghe; sổ sự kiện về theo đợt gom, lời nhắc dùng bài về ngay";
  } catch (e) { MT.song(null, e.message); }
  veDem();
}

// ── 3D ↔ phẳng: tự về phẳng khi không có WebGL 2, màn < 900 điểm ảnh, thư viện 3D không nạp được, hoặc người xem chọn ──
const WEBGL = V3.coWebGL();
const docChe = () => { try { return localStorage.getItem(KHOA_CHE) || ""; } catch (e) { return ""; } };
const luuChe = v => { try { localStorage.setItem(KHOA_CHE, v); } catch (e) { /* trình duyệt chặn lưu: chỉ nhớ trong lượt này */ } };
function cheMuon() {
  if (!WEBGL) { LY_DO_2D = "Máy / trình duyệt này chưa vẽ được 3D (không có WebGL 2)"; return "2d"; }
  const c = docChe();
  if (c === "phang") return "2d";
  if (c === "cham") { LY_DO_2D = "Lần trước máy vẽ 3D quá chậm nên đang xem phẳng — bấm để thử lại 3D"; return "2d"; }
  if (innerWidth < 900) { TU_DONG = true; LY_DO_2D = "Màn hình hẹp dưới 900 điểm ảnh — đang xem phẳng"; return "2d"; }
  return "3d";
}
function capNut() {
  const b = $("doi-che-do"), ba = V && V.ten === "3d";
  b.hidden = false;
  b.disabled = !ba && (!WEBGL || V3.hong);
  b.textContent = ba ? "Xem phẳng" : "Xem 3D";
  b.title = ba ? (V3.tatBloom ? "Máy chạy chậm nên đã tắt hào quang. " : "") + "Chuyển sang bản đồ phẳng (nhẹ hơn cho máy yếu)" :
    b.disabled ? (V3.hong ? "Không mở được bản 3D: " + V3.hong : LY_DO_2D) : (LY_DO_2D ? LY_DO_2D + " · " : "") + "Xem não dạng 3D phát sáng";
}
function batChe(che) {
  if (che === "3d") {
    try { V = V3; V3.tao(); return; } catch (e) { V3.hong = e.message; console.warn("bản 3D lỗi, về phẳng:", e); try { V3.huy(); } catch (e2) { /* bỏ qua */ } }
  }
  V = V2; V2.tao();
}
async function doiChe(che, nguoi) {
  if (nguoi) { luuChe(che === "3d" ? "3d" : "phang"); TU_DONG = false; }
  if (che === "3d" && !(await V3.nap())) { V3.hong = V3.loiNap || "không nạp được thư viện 3D"; che = "2d"; }
  if (V && V.ten === che) return capNut();
  const giu = SEL;
  if (V) V.huy();
  V = null; batChe(che);
  if (DU_GOC) { KY = ""; NUT = {}; capNhat(JSON.parse(DU_GOC)); }
  capNut();
  const n = giu && NUT[giu];
  if (n) chon(n); else if (!SEL) $("phai").innerHTML = goiY();
}

// ── tương tác bảng ──
$("doi-che-do").addEventListener("click", () => doiChe(V && V.ten === "3d" ? "2d" : "3d", true));
$("loc-nhom").addEventListener("click", e => { const b = e.target.closest("[data-nhom]"); if (!b) return; const k = b.dataset.nhom; LOC.nhom.has(k) ? LOC.nhom.delete(k) : LOC.nhom.add(k); veLoc(); });
$("loc-mau").addEventListener("click", e => { const b = e.target.closest("[data-mau]"); if (!b) return; const k = b.dataset.mau; LOC.mau.has(k) ? LOC.mau.delete(k) : LOC.mau.add(k); veLoc(); });
$("chu-bp").addEventListener("click", e => { const b = e.target.closest("[data-bp]"); const n = b && NUT[b.dataset.bp]; if (n) tapTrung(n); });
lop3.addEventListener("click", e => { const b = e.target.closest("[data-id]"); const n = b && NUT[b.dataset.id]; if (n) tapTrung(n); });
$("chon-bp").addEventListener("change", e => { LOC.bp = e.target.value; tinhHien(); if (LOC.bp) tapTrung(NUT[LOC.bp]); else { if (V) V.tongThe(); chon(null); } });
$("phai").addEventListener("click", e => {
  const a = e.target.closest("[data-lk]"); if (!a) return;
  e.preventDefault();
  const t = a.dataset.lk, n = NUT[t] || (t === "_ban-do" ? NUT[TRUNG_TAM] : t.endsWith("/so-tay") ? NUT[t.slice(0, -7)] : null);
  if (n) { moLoc(n); tapTrung(n); } else chon(null, t);
});
$("xung").addEventListener("click", e => {
  const r = e.target.closest(".xung"); if (!r) return;
  const n = NUT[r.dataset.nr] || NUT[r.dataset.bp]; if (n) { moLoc(n); tapTrung(n); }
});
const timKq = $("tim-kq");
let TIM = [];
$("tim").addEventListener("input", MT.doiCo(() => {
  const q = boDau($("tim").value.trim());
  TIM = q.length < 2 ? [] : Object.values(NUT).filter(n => (n.__tim = n.__tim || boDau([n.id, n.ten, n.cau, ...(n.kenh || [])].join(" "))).includes(q)).slice(0, 8);
  timKq.innerHTML = q.length < 2 ? "" : TIM.length ? TIM.map(n => `<button data-id="${esc(n.id)}"><i style="background:${MAU[n.mau] || "#94a3b8"}"></i>${esc(n.ten)}</button>`).join("") : `<div class="trong">không thấy</div>`;
}, 120));
$("tim").addEventListener("keydown", e => { if (e.key === "Enter" && TIM[0]) { moLoc(TIM[0]); tapTrung(TIM[0]); } });
timKq.addEventListener("click", e => { const b = e.target.closest("[data-id]"); const n = b && NUT[b.dataset.id]; if (n) { moLoc(n); tapTrung(n); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && SEL) chon(null); });
addEventListener("resize", MT.doiCo(() => {
  if (!V) return;
  if (V.ten === "3d" && innerWidth < 900) { TU_DONG = true; LY_DO_2D = "Màn hình hẹp dưới 900 điểm ảnh — đang xem phẳng"; doiChe("2d"); return; }
  if (V.ten === "2d" && TU_DONG && innerWidth >= 900 && WEBGL && !["phang", "cham"].includes(docChe()) && !V3.hong) { TU_DONG = false; LY_DO_2D = ""; doiChe("3d"); return; }
  V.doiCo();
}, 150));

(async function batDau() {
  let che = cheMuon();
  const dTai = MT.taiJSON("/nao-bo-phan/do-thi.json");
  if (che === "3d" && !(await V3.nap())) { V3.hong = V3.loiNap || "không nạp được thư viện 3D"; che = "2d"; }
  if (che === "2d" && typeof ForceGraph !== "function") { MT.song(null, "thiếu /vendor/force-graph.min.js"); return; }
  batChe(che);
  capNut();
  $("phai").innerHTML = goiY();
  try {
    const d = await dTai;
    capNhat(d); DEM = d.dem; MT.song(d.luc); veDem();
  } catch (e) { MT.song(null, e.message); $("phai").innerHTML = `<div class="trong">không tải được bản đồ não: ${esc(e.message)}</div>`; return; }
  await nghe();
  MT.lamMoi(nghe, 3000);

})();
