# ---- Chuẩn bìa của NGÁCH (core/bia_theo_khuon.py, 30/09/2026) ----
# Lớp BẮT BUỘC cho mọi tấm bìa của mọi kênh trong nhóm. Rút từ 493 bìa THẬT của đối thủ
# (workspace/nghien-cuu-bia/BAO-CAO-BIA.md): đặc trưng bìa KHÔNG tách được video nổ khỏi video
# thường, nhưng cả hai nhóm cùng theo chuẩn này — "vé vào cửa". Bộ áo riêng (nét vẽ, màu, nhân
# vật) vẫn lấy từ style.yaml của từng kênh. Ngách khác: khai khoá này bằng số của ngách đó;
# không khai = không chèn lớp chuẩn ngách.
