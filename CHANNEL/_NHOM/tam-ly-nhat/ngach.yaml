    tang_duoi_lon_nhat: true     # 66%
    chiem_khung_pct: [40, 55]
    tong_ky_tu_toi_da: 20        # trung vị ngách 17; bìa thắng TL3 18
  nen:
    loai: canh_minh_hoa          # cảnh cụ thể (phòng, phố, bàn…), không nền trơn trắng/đen
    anh_sang: am
  nhan_vat:
