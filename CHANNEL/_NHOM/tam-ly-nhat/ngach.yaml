  so_bia_mau: 493
  chu:
    tran_co_vien: true           # 80% bìa ngách: chữ trần, không khối nền
    vien: {co: true, mau: den}   # 75% có viền ở mọi tầng
    mau_chinh: [vang, trang]     # 78% có chữ vàng
    tu_khoa_mau_khac: do         # 78% tô màu khác cho từ khoá
    so_tang: [2, 3]              # 80%
