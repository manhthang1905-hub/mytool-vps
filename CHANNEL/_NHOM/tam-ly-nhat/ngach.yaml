# ============================================================================
# Hồ sơ ngách — nhóm "tam-ly-nhat" (tâm lý học / khoa học não bộ tiếng Nhật)
# ============================================================================
#
# 30/09/2026 (Đợt 4 áp lên bản sống): MÃ ĐỌC TỆP NÀY cho mọi luật ngách/thị trường — từ khoá lọc,
# cụm V7, cổng tuổi, tệp khán giả, lời nhắc AI, bậc làm tròn view (core/ho_so_ngach.py). Với nhóm
# này mọi khoá là BẢN SAO ĐÚNG hằng số mặc định trong core/*.py, nên đọc tệp không đổi một điểm số
# nào; tests/test_ngach_tam_ly_khop_ma.py canh điều đó (sửa hằng số trong mã mà quên tệp này, hoặc
# ngược lại, là test đỏ).
#
# Muốn đổi luật CỤM của một kênh cụ thể: sửa CHANNEL/<kênh>/nghien-cuu/cong-thuc-v7.json (tệp kênh
# đè lên mặc định). Tệp này chỉ là mặc định của CẢ NHÓM, và là khuôn cho kênh mới trong nhóm.
# Ngách/quốc gia khác: chép CHANNEL/_KHUON/ngach-mau*.yaml.

mo_ta_ngach: "Tâm lý học / khoa học não bộ tiếng Nhật — remake content dạng chân dung một kiểu người"
ngon_ngu_nguon: ja
dang_thang: 'chân dung một kiểu người — "người như thế này thì thật ra…"'

# Mô tả ngách THEO NGHĨA cho AI lọc (trang chủ, chốt đối thủ, biên tập). Viết bằng ý, không bằng
# từ khoá — AI đọc đoạn này để phán "video/kênh này có thuộc ngách không".
mo_ta_cho_loc_ai: >-
  Thuộc ngách: video kể về MỘT KIỂU NGƯỜI, một cảm xúc, một thói quen hay một nét tính cách, và
  giải thích nó bằng tâm lý học / não bộ để người xem tự hiểu mình ("người thích ở một mình thật ra…",
  "tâm lý của người giàu không phô trương", "vì sao người hay nói お願いします ở quầy…"). Đề tài có thể
  là tiền bạc, nhà cửa, tuổi tác, thú cưng, sở thích — miễn TRỌNG TÂM là tâm lý con người. Kênh tự gọi
  mình là 雑学 vẫn thuộc ngách nếu video của nó là chân dung tâm lý (nhiều đối thủ thật như thế).
  Khán giả thật YouTube đang phát ngách này tới: người Nhật 45–65+ (55+ chiếm ~60%), xem nhiều trên TV.
  KHÔNG thuộc ngách: tin tức, thể thao, giải trí, nhạc, game, anime, phim; nấu ăn, mẹo vặt thuần tuý;
  dạy đầu tư/kiếm tiền; sức khoẻ thể chất/y khoa; chuyện người nổi tiếng; tạp học trôi nổi không nói gì
  về tâm lý con người; trò chơi trắc nghiệm 心理テスト; tóm tắt sách, đọc sách, cắt clip, tổng hợp 2ch;
  Shorts.
